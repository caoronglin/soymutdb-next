# =====================================================================
# SoyMutDB API — conda 环境定义（备选部署路径，D6 重新启用）
# =====================================================================
# 用法：
#   conda env create -f deploy/conda/environment-api.yml     # 首次创建
#   conda env update -f deploy/conda/environment-api.yml     # 依赖更新
#
# 定位：
#   - 主路径是 docker compose（docker-compose.yml + deploy/linux/install.sh
#     + deploy/scripts/upgrade.sh）；本环境用于无 docker / 离线 / 本地开发
#     服务器，完整指南见 deploy/conda/README.md。
#   - 依赖清单与 apps/api/pyproject.toml [project.dependencies] 对齐，
#     版本取 pyproject 下限（>= 约束；fastapi 在 pyproject 固定 ==0.137.1，
#     此处放宽为 >=0.137.1 以便 conda 环境内小版本安全升级）。
#   - 应用代码不在此处安装（pip 段只装依赖）：由
#     deploy/scripts/conda-deploy.sh 以 `pip install -e apps/api --no-deps`
#     或 PYTHONPATH 方式引入，见 README。
name: soymutdb-api
channels:
  - conda-forge
dependencies:
  - python=3.14          # pyproject requires-python = ">=3.14"
  - pip>=24.0
  # 系统/构建依赖：conda-forge 对下方包均提供预编译 wheel，通常无需额外
  # 系统包；如遇源码编译报错，可补装 gcc_linux-64 / libpq / openssl。
  - pip:
      # ---- Web 框架 ----
      - fastapi>=0.137.1
      - starlette>=1.3.1
      - uvicorn[standard]>=0.34.0,<0.35.0
      - pydantic>=2.10.0
      - pydantic-settings>=2.6.0
      - email-validator>=2.2.0
      - jinja2>=3.1.0
      # ---- 数据访问（PG / ClickHouse / Redis / Celery / S3）----
      - sqlalchemy[asyncio]>=2.0.36
      - asyncpg>=0.30.0
      - alembic>=1.14.0
      - clickhouse-connect>=0.8.0
      - redis>=5.2.0
      - celery[redis]>=5.4.0
      - boto3>=1.35.0
      - botocore>=1.35.0
      - numpy>=2.0
      - scipy>=1.14.0
      # ---- 安全 / 序列化 / 渲染 ----
      - argon2-cffi>=23.1.0
      - PyJWT>=2.10.0
      - orjson>=3.10.0
      - bleach>=6.0.0
      - openpyxl>=3.1.0
      # ---- 可观测 / HTTP 客户端 ----
      - prometheus-client>=0.21.0
      - structlog>=24.4.0
      - opentelemetry-api>=1.28.0
      - opentelemetry-instrumentation-fastapi>=0.49b0
      - httpx>=0.28.0
      - aiohttp>=3.10.0
      # ---- dev（可选；pyproject [project.optional-dependencies].dev）----
      - pytest>=8.0.0
      - pytest-asyncio>=0.24.0
      - pytest-cov>=5.0.0
      - ruff>=0.8.0
      # mypy>=1.13.0 / testcontainers[postgres]>=4.8.0 未列入
      # （testcontainers 依赖 docker，与 conda 裸机场景相悖；需要时自行添加）
