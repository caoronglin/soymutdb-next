# =============================================================================
# SoyMutDB — dependency governance pipeline (CNB)
# =============================================================================
# Source of truth: the `Dependency governance` stage of `.cnb.yml`.
# Fails closed on any unavailable analyzer instead of skipping it.
#
# The gate needs BOTH toolchains in one container:
#   * `pnpm deps:graphs` / `pnpm deps:audit` shell out through Node/pnpm;
#   * `scripts/dependency_governance.py` imports PyYAML and drives `uv`/`uvx`
#     for the Deptry/license analyzers.
# The bare `node:24.19.0` override carried no Python packaging toolchain (no
# pip), and the first real build (cnb-mqg-1k289oe96) died on:
#
#   ModuleNotFoundError: No module named 'yaml'
#
# CNB accepts a Dockerfile only in `docker.build` (pipeline-scoped), and a
# repository path in a stage `image:` is handed to `docker pull` and rejected
# with `invalid reference format`. So the dual-toolchain image is declared once
# here and the stage drops its own `image:`. `scripts/ci-job-steps.sh` pins
# PyYAML and uv inside the job body, so the gate never skips a missing tool.
# =============================================================================
name: SoyMutDB dependency governance
docker:
  # The store volume keeps `pnpm install --frozen-lockfile` a link pass instead
  # of a download pass; contract tests assert every pnpm stage is able to reach
  # it (a store inside the container layer is discarded with the container).
  volumes:
    - /cache/pnpm-store
  build:
    dockerfile: .cnb/env/Dockerfile.frontend
    by:
    - .cnb/env/Dockerfile.frontend
stages:
- name: Dependency governance
  script: bash scripts/ci-job-steps.sh run dependency-governance
