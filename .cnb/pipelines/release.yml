# =============================================================================
# SoyMutDB — OCI release pipeline (CNB)
# =============================================================================
# Turns the platform-verified image packages produced by the `docker-images`
# pipeline into one signed multi-architecture release, using the same script the
# GitHub mirror calls (scripts/release-contract.golden.sh).
#
# Source of truth: `.cnb.yml` (`main` -> `push` -> `release`). This file exists so
# the release definition can be reviewed and unit-tested in isolation.
#
# Secrets (configure in the CNB UI, never in the repository):
#   $SOYMUTDB_RELEASE_COSIGN_KEY  optional offline cosign key
#   $SOYMUTDB_OIDC_ISSUER         OIDC issuer to verify against
#
# Ordering
#   The packages this pipeline consumes are artifacts of two other pipelines
#   (`docker-images (amd64)` and `(arm64)`), so the release must not start until
#   both exist. `cnb:await` / `cnb:resolve` provide that ordered start: each
#   image pipeline ends with its independently keyed `resolve`, and this
#   pipeline opens with both matching `await` stages. `cnb:await` may only run
#   in `stages`, which is why the waits are stages here rather than
#   `endStages`/`failStages` entries.
#
#   The wait is not sufficient on its own: the packages themselves travel as
#   uploaded artifacts, and `scripts/release-contract.golden.sh` fetches them
#   with the plugin the platform documents for that job
#   (https://cnb.cool/cnb/plugins/cnbcool/attachments). Both halves are required
#   -- a wait without the fetch still finds an empty directory, and a fetch
#   without the wait races the build.
#
# The release job body lives once, in scripts/release-contract.golden.sh: it
# resolves the verified per-architecture packages, logs into the registry,
# merges the manifest, signs keylessly through the pipeline OIDC identity, emits
# SLSA + SPDX attestations and writes the checksummed release contract. It
# installs (and checksum-verifies) cosign itself. Re-inlining any part of that
# sequence here would fork the release definition away from the script both
# providers run, which scripts/test_ci_job_contracts.py fails on.
#
# Signing identity
#   Signing is keyless: the Sigstore identity is minted from this pipeline's
#   OIDC token, so no long-lived signing key is stored in the repository. The
#   resulting attestations carry the CNB pipeline identity as their provenance
#   subject, which is what makes the release verifiable after the fact. Setting
#   $SOYMUTDB_RELEASE_COSIGN_KEY switches to an offline cosign key for
#   environments without OIDC; see .cnb/examples/release-secrets.example.yml.

env:
  RELEASE_OUTPUT_DIR: release-contract

stages:
  - name: Wait for the verified amd64 image package
    # Blocks until `docker-images (amd64)` resolves its key, which is its last
    # normal stage. A pipeline that never resolves is reported as a dead lock
    # rather than waiting forever.
    type: cnb:await
    options:
      key: validated-runtime-images-amd64

  - name: Wait for the verified arm64 image package
    # The second independent gate prevents a release made from only the first
    # architecture from racing the arm64 verifier.
    type: cnb:await
    options:
      key: validated-runtime-images-arm64

  - name: Publish signed multi-architecture release
    # A CNB stage body is executed with `sh`, which rejects bash-only syntax.
    # Pinning the interpreter here keeps the stage runnable regardless of the
    # platform default. See docs/ops/ci-cd.md, "Stage shell".
    script: bash scripts/release-contract.golden.sh

  - name: Upload signed OCI release contract
    image: cnbcool/artifact
    settings:
      # The release contract is the only artifact a deployer needs: digests,
      # provenance, SBOMs and their checksums.
      path: release-contract
      name: oci-release-contract-$CNB_COMMIT_SHORT
