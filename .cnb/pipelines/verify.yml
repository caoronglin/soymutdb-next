# =============================================================================
# SoyMutDB — verification pipeline (CNB)
# =============================================================================
# Source of truth: `.cnb.yml` (`main` -> `push` -> `verify`). Recorded here so
# the job list is reviewable in isolation and asserted by
# scripts/test_ci_job_contracts.py. The GitHub mirror workflow calls the same
# scripts/ci-job-steps.sh entry points.
# =============================================================================
name: verify
runner:
  cpus: 16
# `volumes` is a PIPELINE-level key (`docker.volumes`), and each entry follows
# CNB's grammar `<path>[:<type>]` -- not Docker's `host:container`. A stage-level
# `volumes:` key, or an entry like `- /cache/pnpm-store:/cache/pnpm-store`, both
# abort the build in Prepare with:
# "Unsupported volume type. 不支持的数据卷类型: /cache/pnpm-store".
docker:
  volumes:
    # pnpm store only; `.turbo` sits under the always-shared /workspace and must
    # not be declared as a nested volume ("存在包含关系的卷路径").
    - /cache/pnpm-store
  # Default environment for every stage below. CNB accepts a Dockerfile only in
  # `docker.build`: a stage-level `image:` is a registry reference passed to
  # `docker pull`, so a repository path in it fails the stage with
  # `invalid reference format`. Stages that need another environment still declare
  # their own `image:` and override this.
  build:
    dockerfile: .cnb/env/Dockerfile.frontend
    by:
    - .cnb/env/Dockerfile.frontend
env:
  VITE_DEPLOYMENT_MODE: demo
  VITE_API_BASE_URL: https://api.soymutdb.test
  VITE_JBROWSE_BASE_URL: https://jbrowse.soymutdb.test
services:
- docker
stages:
- name: Frontend verification
  script: bash scripts/ci-job-steps.sh run frontend
- name: API + Worker verification
  image: python:3.15
  script: bash scripts/ci-job-steps.sh run api-tests
# Mirrors the root .cnb.yml stage. The repo contract suites had no CI coverage
# on either provider, so a shared script that lost its exec bit passed every
# pipeline and reached main.
- name: Contract suites
# No image override: this layer needs BOTH pinned interpreters. It runs
        # pytest against the Python contracts and shells out to node for the
        # TypeScript helper behind resolveDevAllowedHosts and for the frontend
        # gate self-test.
        #
        # A Python-only stage image (python:3.14 at the time of that run,
        # python:3.15 today) was the earlier choice and it failed on the
        # second CNB run of this stage (cnb-t65-1k4ibj79d, 2026-10-10) with
        # "FileNotFoundError: No such file or directory: 'node'" — 264 contracts
        # passed, then two could not run at all.
        #
        # The pipeline image is the repository's own artifact, built
        # `FROM python:3.15` with Node 26.13.0 unpacked on top
        # (.cnb/env/Dockerfile.frontend), so it is the one image carrying both
        # pins. It is deliberately NOT `FROM node:26.13.0` plus
        # `COPY --from=python:3.15`: node:26.13.0 is bookworm (glibc 2.36)
        # while python:3.15 needs glibc 2.38, so the copied interpreter cannot
        # start — which is exactly why the Dockerfile unpacks a tarball instead.
  script: bash scripts/ci-job-steps.sh run smoke-contracts
# No stage `image:`: the job needs Node AND Python 3.15. The graph generator
# imports PyYAML and every Python analyzer shells out to uv, while
# `node:26.13.0` -- the image this stage used to pin -- carries no Python at
# all. The pipeline-level environment (`.cnb/env/Dockerfile.frontend`) is the
# one image that provides both toolchains, and the job body installs the
# PyYAML/uv pins itself so neither provider can skip the gate.
- name: Dependency governance
  script: bash scripts/ci-job-steps.sh run dependency-governance
# W6. Reproducibility gate, not a benchmark: it asserts the harness replays
# and both arms return the same rows with one factor changed. CI timings are
# shared-container noise; see scripts/verify-db-ab-harness.sh.
- name: Database A/B harness (reproducibility gate)
  image: python:3.15
  script: bash scripts/ci-job-steps.sh run db-ab
- name: Build the checksummed Pages artifact
  image: node:26.13.0
  script: bash scripts/build-pages-artifact.sh && bash scripts/verify-pages-artifact.sh pages-dist
- name: Upload GitHub Pages demo artifact
  image: cnbcool/artifact
  settings:
    path: pages-dist
    name: pages-demo-dist
endStages:
- name: Upload verification evidence
  image: cnbcool/artifact
  settings:
    path: artifacts
    name: verification-evidence-$CNB_COMMIT_SHORT
