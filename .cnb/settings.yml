# =============================================================================
# SoyMutDB — CNB repository UI configuration
# =============================================================================
# Two things are customised: the cloud-development entry point and the NPC role
# that `@`-mention tasks run as. Everything else keeps the platform default.
#
# The development button is the human-facing half of "CNB 启动": pressing it
# runs the `$` -> `vscode` pipeline in .cnb.yml, which delegates to
# scripts/start-cloud-dev.sh. See docs/ops/cnb-startup-acceptance.md.
#
# Keep this file free of anything secret: it is committed and readable by
# anyone who can read the repository.
# =============================================================================

# -----------------------------------------------------------------------------
# NPC roles
# -----------------------------------------------------------------------------
# The `$` -> `issue.comment@npc` pipeline in .cnb.yml is this repository's NPC
# entry point, and an NPC event resolves its role *by name* against this list.
# With no `npc.roles` the platform aborts the run in its `npc go` stage with
# "No roles defined in .cnb/settings.yml" -- before the container starts, so the
# pipeline body in .cnb.yml never gets a chance to report anything useful.
#
# `name` must match the role the operator mentions; `prompt` is the standing
# brief. Keep it about *how* to work in this repository rather than repeating
# AGENTS.md, which the runtime already reads.
npc:
  roles:
    - name: CodeBuddy
      slogan: 交付流水线、数据库契约与测试的常驻值守
      prompt: |
        你在 SoyMutDB 仓库里工作。先读 AGENTS.md 与 docs/dev/database-core-contract.md，
        再动手。
        - 交付链条以 .cnb.yml 为准，具体逻辑写在 scripts/ 里；不要往流水线里内联
          build/test 逻辑，scripts/test_ci_job_contracts.py 会拦。
        - 生物实体的公开标识、装配版本（v4/v5）与 internal/external 站点边界是契约，
          不靠字符串相似度推断，不放宽白名单绕过。
        - 报告结论时给出可复核的命令与通过数，失败的用例不要隐藏或跳过。
      enableThinking: false
    # `@CodeBuddy` above is the system NPC and always resolves. The two below are
    # repository-local roles: they exist so delegation has a name to point at,
    # and so a task can be handed to a role whose brief is narrower than
    # "do whatever the issue says".
    #
    # Keep the split matching docs/ops/soymutdb-next-handoff.md: 功能开发 owns
    # apps/worker + the API/worker blast services, review owns nothing but
    # comments. The two BLAST entry points under apps/web have exactly one owner
    # at a time -- that is what stops parallel agents rewriting the same file.
    - name: 代码审查员
      slogan: 只对本次改动里的事实性错误提意见，其余放行
      prompt: |
        你是 SoyMutDB 的代码审查员。SoyMutDB 是生物信息学数据库，正确性优先于
        功能数量。只对事实性错误提意见：逻辑错误、契约破坏、安全与隐私泄漏、
        跨装配/跨版本的坐标混用、注释与代码不符。风格偏好与可以以后再说的问题
        一律放行，不要用意见淹没作者。
        仓库规范以 AGENTS.md 与 docs/dev/database-core-contract.md 为准。
      enableThinking: false
    - name: 功能开发
      slogan: 按验收标准实现，把跑得了和跑不了分开写
      prompt: |
        你是 SoyMutDB 的功能开发 NPC，负责后端与数据链路。先读 AGENTS.md、
        docs/dev/database-core-contract.md 与 docs/implementation/roadmap.md
        再动手。只改被指派范围内的文件，不顺手重构无关代码。
        交付时把「实际执行了什么」和「跑不了的为什么跑不了」分开写清楚，
        不要把只做了设计的部分说成已完整实现。
      enableThinking: false
workspace:
  launch:
    button:
      # Label the button after what it produces, not after the platform
      # feature, so a new contributor knows this starts a runnable SoyMutDB
      # environment rather than an empty IDE.
      name: 启动 SoyMutDB 开发环境
      description: >-
        拉起依赖并准备开发环境；启动后在终端运行 pnpm dev:web / uvicorn，
        或用「预览 SoyMutDB 门户」按钮直接打开门户预览。
        门户预览会自动放行 CNB 生成的 *.cnb.space / *.cnb.run 主机名。
    # 4 cores / 8 GB is enough for pnpm install + Vite + uvicorn. The platform
    # default (8 cores / 16 GB) is sized for the delivery pipelines, which build
    # and scan container images.
    cpus: 4
