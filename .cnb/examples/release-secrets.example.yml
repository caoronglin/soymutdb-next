# =============================================================================
# Example: CNB secret repository layout for SoyMutDB delivery
# =============================================================================
# Host this in a private repository (e.g. crl-code/secrets) and import it from
# the pipelines that need it. Never copy real credentials into the product repo.
#
#   imports:
#     - https://cnb.cool/crl-code/secrets/-/blob/main/soymutdb-release.yml
#
# Registry credentials are NOT needed here: image pushes authenticate with the
# build-scoped CNB_TOKEN against CNB_DOCKER_REGISTRY (see
# scripts/release-contract.golden.sh).
# =============================================================================
secrets:
  # Optional: offline cosign key for environments without OIDC.
  SOYMUTDB_RELEASE_COSIGN_KEY: "<base64-encoded cosign private key>"
  # OIDC issuer that release verification should trust.
  SOYMUTDB_OIDC_ISSUER: https://token.actions.githubusercontent.com
  # Optional: adapter sourced by the publication pipeline to upload the verified
  # static tree (function `publish_pages_tree <dir>`).
  SOYMUTDB_PAGES_PUBLISH_ADAPTER: "<url to the adapter script>"
