[workspace]
members = [
    "apps/core-rs",
    "apps/admin/src-tauri",
]
resolver = "2"

[workspace.package]
version = "2.0.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
authors = ["SoyMutDB Consortium"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
