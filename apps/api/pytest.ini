# Pytest configuration for SoyMutDB API tests

[pytest]
testpaths = tests
# `tests/a0` imports the repo-root `tools.a0` package, so the repo root must
# be importable for `cd apps/api && python -m pytest tests` to work without
# an exported PYTHONPATH.
pythonpath = ../..
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
# Single session-scoped loop: the shared test engine (session-scoped async
# fixture) must live on the same loop as the tests, otherwise asyncpg
# connections error with "attached to a different loop".
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session

# Warnings configuration
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Markers
markers =
    asyncio: mark test as async
    slow: marks tests as slow
    integration: marks tests as integration tests requiring external services

# Minimum version
minversion = 8.0

# Addopts
addopts = -v --tb=short
