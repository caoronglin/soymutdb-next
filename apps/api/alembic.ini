# Alembic configuration for SoyMutDB API

[alembic]
# Path to the migration scripts
script_location = migrations

# Template used to generate migration file names
file_template = %%(rev)s_%%(slug)s

# Timezone for the create_date column
timezone = UTC

# Max length of slugified message
truncate_slug_length = 40

# Python module to import for the env.py script
# (the actual SQLAlchemy URL is set programmatically in env.py from settings)
sqlalchemy.url = postgresql+asyncpg://soymutdb:soymutdb_dev_password@localhost:5432/soymutdb

[post_write_hooks]

# Log format
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
