[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "soymutdb-api"
version = "2.0.0"
description = "SoyMutDB REST API — FastAPI application for a multi-species mutation database (soybean as the first/default species)"
requires-python = ">=3.14"
license = { text = "MIT" }
dependencies = [
    "soymutdb-import-protocol==0.1.0",
    "soymutdb-jobs==0.1.0",
    "fastapi==0.142.2",
    "starlette>=1.3.1",
    "uvicorn[standard]>=0.34.0,<0.35.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "clickhouse-connect>=0.8.0",
    "redis>=5.2.0",
    "celery[redis]>=5.4.0",
    "argon2-cffi>=23.1.0",
    "PyJWT>=2.10.0",
    "orjson>=3.10.0",
    "numpy>=2.0",
    "structlog>=24.4.0",
    "boto3>=1.35.0",
    "botocore>=1.35.0",
    "scipy>=1.14.0",
    "httpx>=0.28.0",
    "email-validator>=2.2.0",
    "opentelemetry-api>=1.28.0",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
    "prometheus-client>=0.21.0",
    "openpyxl>=3.1.0",
    "bleach>=6.0.0",
    "Jinja2>=3.1.0",
    "aiohttp>=3.10.0",
]

[tool.uv.sources]
soymutdb-import-protocol = { path = "../../packages/import-protocol" }
soymutdb-jobs = { path = "../../packages/jobs-py" }

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "testcontainers[postgres]>=4.8.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
