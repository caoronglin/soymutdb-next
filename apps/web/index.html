<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2F6F4F" />
    <meta
      name="description"
      content="SoyMutDB — a comprehensive multi-species mutant database (soybean as the first/default species) providing massive variant data, gene information, mutant resources, and a genome browser to advance plant functional genomics research."
    />
    <meta name="author" content="SoyMutDB Consortium" />

    <!-- Content Security Policy: keep in sync with apps/web/public/_headers and
         apps/web/scripts/base-template.ts (SSG pages). REPLACE the placeholder
         domains before going live: https://api.example.com -> production API
         origin, https://jbrowse.example.com -> deployed JBrowse origin (iframe
         on /browse). Preview deployments: use the STAGING origins instead.
         When VITE_CDN_ENABLED=true, add CDN domains to script-src in BOTH this
         meta tag and the _headers CSP (e.g. cdnjs.cloudflare.com, cdn.jsdelivr.net). -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://api.example.com; frame-src 'self' https://jbrowse.example.com; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; object-src 'none'; worker-src 'self' blob:"
    />

    <!-- Preconnect to font origins for faster font load -->

    <!-- Cloudflare Web Analytics beacon placeholder. Replaced at build time by
         vite.config.ts (transformIndexHtml) with the full beacon <script> when
         VITE_CLOUDFLARE_ANALYTICS_TOKEN is set; removed otherwise so builds
         without a token are unchanged. See deploy/cloudflare.md §Web Analytics. -->
    <!-- %CLOUDFLARE_ANALYTICS_TOKEN% -->

    <title>SoyMutDB — Multi-Species Mutant Database</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
