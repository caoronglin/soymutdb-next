[project]
name = "soymutdb-mcp-server"
version = "0.1.0"
description = "SoyMutDB MCP server (FastMCP, Streamable HTTP) - tool stubs calling the internal REST API"
readme = "README.md"
# Every workspace package declares the same license, so the dependency
# governance license projection reports `MIT` instead of `UNKNOWN` for this
# first-party distribution (apps/api, apps/worker and packages/jobs-py already
# carry it).
license = { text = "MIT" }
requires-python = ">=3.15"
dependencies = [
    "fastmcp>=3.2.0,<4",
    "httpx>=0.27",
    # No upper bound: the <0.36.0 ceiling is what pinned this server to an ASGI
    # server release older than the one the rest of the repository installs.
    "uvicorn>=0.35.0",
    "redis>=5.0",
]

[project.optional-dependencies]
test = [
    "fakeredis>=2.20",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
soymutdb-mcp = "mcp_server.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
