[project]
name = "soymutdb-mcp-server"
version = "0.1.0"
description = "SoyMutDB MCP server (FastMCP, Streamable HTTP) - tool stubs calling the internal REST API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.4,<4",
    "httpx>=0.27",
    "uvicorn>=0.30",
    "redis>=5.0",
]

[project.optional-dependencies]
test = [
    "fakeredis>=2.20",
]

[project.scripts]
soymutdb-mcp = "mcp_server.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
