# =====================================================================
# JBrowse Genome Browser — Container Nginx Config
# Serves static JBrowse assets with gzip_static support.
# =====================================================================
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # gzip compression
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml application/xml+rss image/svg+xml font/woff font/woff2;

    # Serve pre-compressed .gz files
    gzip_static on;

    # Immutable hashed assets
    location ~* "\.[0-9a-f]{8,}\.(js|css|woff2?|svg|png|jpg|jpeg|gif|ico)$" {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Static assets
    location ~* \.(?:js|css|woff2?|svg|png|jpg|jpeg|gif|ico|json|txt|bgz|tbi|csi)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
