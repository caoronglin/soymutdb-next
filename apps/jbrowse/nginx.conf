# =====================================================================
# JBrowse Genome Browser — Container Nginx Config
# Serves static JBrowse assets with gzip_static support.
#
# Scope: this container is the OPTIONAL self-hosted JBrowse runtime. In the
# production topology JBrowse is static-hosted and its policy lives in
# apps/jbrowse/public/_headers (Cloudflare Pages), which is where the exact API
# and data origins and the portal/admin `frame-ancestors` allowlist belong —
# a container config cannot know those origins.
#
# The framing policy below (`frame-ancestors 'self'` / XFO SAMEORIGIN) is
# therefore the same-origin one, which matches how this container is actually
# reached: through the main proxy at /soymutdb-jbrowse/, same origin as the
# portal. Serving this container on its own hostname and embedding it from a
# different portal origin requires the `_headers` path instead.
# =====================================================================

# HSTS only when TLS was terminated upstream (this container speaks plain HTTP).
# The shared fragment references `$hsts_header_value`, so the variable must be
# defined here — an undefined variable is an `nginx: [emerg] unknown variable`
# startup failure, not a warning.
map $http_x_forwarded_proto $hsts_header_value {
    default "";
    https   "max-age=31536000; includeSubDomains";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers — the shared fragment, included here and in every
    # location that sets a header of its own. Without the per-location include,
    # nginx drops the whole inherited set: the two asset locations below (each
    # with its own Cache-Control) used to serve responses with no XFO, no
    # nosniff and no Referrer-Policy.
    include /etc/nginx/conf.d/security-headers.inc;

    # gzip compression
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml application/xml+rss image/svg+xml font/woff font/woff2;

    # Serve pre-compressed .gz files
    gzip_static on;

    # Immutable hashed assets
    location ~* "\.[0-9a-f]{8,}\.(js|css|woff2?|svg|png|jpg|jpeg|gif|ico)$" {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/conf.d/security-headers.inc;
        access_log off;
        try_files $uri =404;
    }

    # Static assets
    location ~* \.(?:js|css|woff2?|svg|png|jpg|jpeg|gif|ico|json|txt|bgz|tbi|csi)$ {
        expires 30d;
        add_header Cache-Control "public";
        include /etc/nginx/conf.d/security-headers.inc;
        try_files $uri =404;
    }

    # SPA fallback — declares no header of its own, so it inherits the
    # server-level set normally.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
