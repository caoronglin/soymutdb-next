[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "soymutdb-worker"
version = "2.0.0"
description = "SoyMutDB Celery worker — BLAST, export, ingestion, and statistics tasks"
requires-python = ">=3.15"
license = { text = "MIT" }
dependencies = [
    "soymutdb-import-protocol==0.1.0",
    "soymutdb-jobs==0.1.0",
    "celery[redis]>=5.4.0",
    "redis>=5.2.0",
    "boto3>=1.35.0",
    "botocore>=1.35.0",
    "pydantic>=2.10.0",
    "structlog>=24.4.0",
    "sqlalchemy>=2.0.36",
    "psycopg2-binary>=2.9.0",
    "jinja2>=3.1.0",
    "bleach>=6.0.0",
    "openpyxl>=3.1.0",
    # Bioinformatics libraries
    "cyvcf2>=0.31.0",
    "pysam>=0.22.0",
    "pyfaidx>=0.8.0",
    "biopython>=1.84",
    "polars>=1.16.0",
    "pyarrow>=18.0.0",
    # Online analysis libraries (analyses queue; fastp is a CLI binary
    # installed in the Docker image, not a pip package)
    "scanpy>=1.10,<1.13",
    "anndata>=0.10,<0.13",
    "leidenalg>=0.10,<0.11",
    "python-igraph>=0.11,<0.13",
    "matplotlib>=3.8",
    "prometheus-client>=0.21.0",
    # GWAS tasks (EMMAX / GEMMA orchestration; Manhattan/QQ aggregation).
    # The engine binaries themselves are ops-installed on the worker host.
    "numpy>=1.26",
    # HTML report generation (SSG gene pages, GWAS Manhattan/QQ report)
    "dominate>=2.9.0",
]

[tool.uv.sources]
soymutdb-import-protocol = { path = "../../packages/import-protocol" }
soymutdb-jobs = { path = "../../packages/jobs-py" }

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    # PostgreSQL integration runs the API-owned async Alembic migration chain.
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "pydantic-settings>=2.6.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]
# Optional desktop notification channel (D2): OS-native notifications via
# plyer, gated at runtime by SOYMUTDB_DESKTOP_NOTIFY=true.  Not required for
# the in-app/browser channels; install with `pip install .[notify]`.
notify = [
    "plyer>=2.1",
]
# Historical ClickHouse migration uses its standalone Python 3.14 image;
# native Python 3.15 backfill reads legacy facts over the standard-library HTTP client.

[tool.hatch.build.targets.wheel]
packages = ["src/soymutdb_worker"]

[tool.hatch.build.targets.wheel.sources]
"src/soymutdb_worker" = "soymutdb_worker"

[tool.ruff]
target-version = "py315"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.mypy]
python_version = "3.15"
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
markers = [
    "slow: capacity or integration acceptance test; the 2M-row tier requires SOYMUTDB_RUN_2M_IMPORT_PERF=1",
]
