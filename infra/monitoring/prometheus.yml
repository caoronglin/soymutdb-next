# =====================================================================
# SoyMutDB Prometheus Configuration
# =====================================================================
# Scrapes only existing services with metrics endpoints:
#   - api (FastAPI /metrics on port 8000)
#   - clickhouse (built-in /metrics on port 9363)
#   - postgres (postgres-exporter on port 9187)
#   - redis (redis-exporter on port 9121)
# Removed: nginx-exporter, worker:9808 (no metrics endpoints)
# =====================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: soymutdb
    environment: production

scrape_configs:
  # ------------------------------------------------------------------
  # API - FastAPI Prometheus metrics
  # ------------------------------------------------------------------
  - job_name: "api"
    static_configs:
      - targets: ["api:8000"]
    metrics_path: "/metrics"
    scrape_interval: 10s
    scrape_timeout: 5s

  # ------------------------------------------------------------------
  # ClickHouse - built-in Prometheus exporter (port 9363)
  # ------------------------------------------------------------------
  - job_name: "clickhouse"
    static_configs:
      - targets: ["clickhouse:9363"]
    metrics_path: "/metrics"
    scrape_interval: 15s

  # ------------------------------------------------------------------
  # PostgreSQL - postgres-exporter
  # ------------------------------------------------------------------
  - job_name: "postgres"
    static_configs:
      - targets: ["postgres-exporter:9187"]
    scrape_interval: 15s

  # ------------------------------------------------------------------
  # Redis - redis-exporter
  # ------------------------------------------------------------------
  - job_name: "redis"
    static_configs:
      - targets: ["redis-exporter:9121"]
    scrape_interval: 15s
