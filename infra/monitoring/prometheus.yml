# =====================================================================
# SoyMutDB Prometheus Configuration
# =====================================================================
# Scrapes only existing services with metrics endpoints (all exporters are
# defined in docker-compose.yml):
#   - api                FastAPI /metrics on port 8000
#   - clickhouse         built-in /metrics on port 9363
#   - postgres-exporter  port 9187 (service: postgres-exporter)
#   - redis-exporter     port 9121 (service: redis-exporter; scrapes both
#                         redis and redis-celery instances)
#   - node-exporter      port 9100 (service: node-exporter)
#   - worker-default / worker-blast / worker-ingest / worker-analyses / beat
#                        worker /metrics on port 9808 (container network only)
# Alert rules: infra/monitoring/rules/*.yml
# =====================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: soymutdb
    environment: production

rule_files:
  - "/etc/prometheus/rules/*.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # ------------------------------------------------------------------
  # API - FastAPI Prometheus metrics
  # ------------------------------------------------------------------
  - job_name: "api"
    static_configs:
      - targets: ["api:8000"]
    metrics_path: "/metrics"
    scrape_interval: 10s
    scrape_timeout: 5s

  # ------------------------------------------------------------------
  # ClickHouse - built-in Prometheus exporter (port 9363)
  # ------------------------------------------------------------------
  - job_name: "clickhouse"
    static_configs:
      - targets: ["clickhouse:9363"]
    metrics_path: "/metrics"
    scrape_interval: 15s

  # ------------------------------------------------------------------
  # PostgreSQL - postgres-exporter
  # ------------------------------------------------------------------
  - job_name: "postgres"
    static_configs:
      - targets: ["postgres-exporter:9187"]
    scrape_interval: 15s

  # ------------------------------------------------------------------
  # Redis - redis-exporter (redis + redis-celery instances, redis_instance
  # label distinguishes them)
  # ------------------------------------------------------------------
  - job_name: "redis"
    static_configs:
      - targets: ["redis-exporter:9121"]
    scrape_interval: 15s

  # ------------------------------------------------------------------
  # Host - node-exporter (disk / CPU / memory)
  # ------------------------------------------------------------------
  - job_name: "node"
    static_configs:
      - targets: ["node-exporter:9100"]
    scrape_interval: 15s

  # ------------------------------------------------------------------
  # Alertmanager - delivery health and notification failure metrics
  # ------------------------------------------------------------------
  - job_name: "alertmanager"
    static_configs:
      - targets: ["alertmanager:9093"]
    scrape_interval: 15s

  # ------------------------------------------------------------------
  # Celery workers & beat - soymutdb_worker metrics (port 9808)
  # ------------------------------------------------------------------
  - job_name: "worker-default"
    static_configs:
      - targets: ["worker-default:9808"]
    scrape_interval: 15s

  - job_name: "worker-blast"
    static_configs:
      - targets: ["worker-blast:9808"]
    scrape_interval: 15s

  - job_name: "worker-ingest"
    static_configs:
      - targets: ["worker-ingest:9808"]
    scrape_interval: 15s

  - job_name: "worker-analyses"
    static_configs:
      - targets: ["worker-analyses:9808"]
    scrape_interval: 15s

  - job_name: "beat"
    static_configs:
      - targets: ["beat:9808"]
    scrape_interval: 15s
