# Receiver credentials are provided only through the mounted Docker secret.
# start-alertmanager.sh refuses to start when that secret is absent or unsafe.
global:
  resolve_timeout: 5m

route:
  receiver: "configured-webhook"
  group_by: ["alertname", "severity"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: "configured-webhook"
    webhook_configs:
      - url_file: /run/secrets/alertmanager_webhook_url
        send_resolved: true
