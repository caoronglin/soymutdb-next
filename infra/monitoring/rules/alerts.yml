# =====================================================================
# SoyMutDB Alerting Rules
# =====================================================================
# 指标来源与依赖：
#   - API 层    soymutdb_http_requests_total / soymutdb_http_request_duration_seconds
#               soymutdb_outbox_* / cache_* / db_pool_connections
#   - Worker 层 soymutdb_worker_up / tasks_total / task_failures_total /
#               task_duration_seconds / queue_depth
#               （apps/worker/src/soymutdb_worker/metrics.py，端口 9808）
#   - PG        pg_stat_database_numbackends（postgres-exporter）
#   - Redis     redis_memory_used_bytes / redis_memory_max_bytes（redis-exporter）
#   - 磁盘      node_filesystem_*（node-exporter，--path.rootfs=/host）
#   - 备份      soymutdb_backup_*（backup.sh 原子写入 node textfile collector）
#   - 投递      alertmanager_notifications_failed_total（Alertmanager 自身指标）
# =====================================================================
groups:
  # ------------------------------------------------------------------
  # API availability & performance
  # ------------------------------------------------------------------
  - name: soymutdb-api
    rules:
      - alert: ApiHigh5xxRate
        expr: >
          sum(rate(soymutdb_http_requests_total{status=~"5.."}[5m]))
          / clamp_min(sum(rate(soymutdb_http_requests_total[5m])), 0.001)
          > 0.02
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "API 5xx rate above 2%"
          description: "API 5xx ratio is {{ $value | humanizePercentage }} over the last 5 minutes (threshold 2%)."

      - alert: ApiHighP95Latency
        # 依赖 API latency histogram（soymutdb_http_request_duration_seconds，
        # 由 MetricsMiddleware 记录；本任务已补齐）。
        expr: >
          histogram_quantile(
            0.95,
            sum(rate(soymutdb_http_request_duration_seconds_bucket[5m])) by (le)
          ) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "API p95 latency above 1s"
          description: "API p95 latency is {{ $value }}s over the last 5 minutes (threshold 1s)."

      - alert: OutboxDeliveryStalled
        expr: soymutdb_outbox_oldest_unsent_age_seconds > 300
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Transactional outbox delivery is stalled"
          description: "The oldest unsent event is {{ $value | humanizeDuration }} old."

      - alert: OutboxDeliveryExhausted
        expr: increase(soymutdb_outbox_delivery_exhausted_total[15m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Outbox delivery exhausted its retry budget"
          description: "At least one transactional outbox event reached its maximum delivery attempts during the last 15 minutes."

      - alert: OutboxFailuresPresent
        expr: soymutdb_outbox_events{status="failed"} > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Outbox has failed delivery records"
          description: "{{ $value }} outbox events remain failed for at least 10 minutes."

      - alert: ApiDatabasePoolSaturation
        expr: >
          max by (job, instance) (
            soymutdb_db_pool_connections{state="checked_out"}
          )
          / clamp_min(
            max by (job, instance) (
              soymutdb_db_pool_connections{state="capacity"}
            ), 1
          ) > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "API database pool above 80% utilization"
          description: "The scraped API process has sustained database pool pressure."

      - alert: CacheReadErrors
        expr: sum(rate(soymutdb_cache_lookups_total{outcome="read_error"}[5m])) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Redis cache read errors are elevated"
          description: "Cache reads are degrading to source queries at {{ $value }} errors/s."

  # ------------------------------------------------------------------
  # Celery workers, beat & queue backlog
  # ------------------------------------------------------------------
  - name: soymutdb-workers
    rules:
      - alert: WorkerOffline
        # up==0 同时覆盖 readiness 失败与进程死亡（job 与 compose 服务一一对应）。
        expr: up{job=~"worker-(default|blast|ingest|analyses)"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Worker {{ $labels.job }} is offline"
          description: "Prometheus cannot scrape {{ $labels.instance }} for 2 minutes."

      - alert: BeatOffline
        expr: up{job="beat"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Celery beat is offline"
          description: "Scheduled tasks (stats/cleanup) are not being dispatched."

      - alert: TaskBacklog
        # 依赖 worker 队列深度指标（metrics.py 每 15s 收集 LLEN；-1 表示
        # 收集失败，不会触发本规则）。阈值按队列独立评估。
        expr: soymutdb_worker_queue_depth > 500
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Queue {{ $labels.queue }} backlog above 500"
          description: "Queue {{ $labels.queue }} has {{ $value }} pending messages for 10 minutes."

      - alert: TaskFailuresSpike
        expr: rate(soymutdb_worker_task_failures_total[15m]) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Elevated worker task failures"
          description: "Queue {{ $labels.queue }} is failing more than 5 tasks/min over the last 15 minutes."

  # ------------------------------------------------------------------
  # Data stores & host
  # ------------------------------------------------------------------
  - name: soymutdb-infrastructure
    rules:
      - alert: PostgresConnectionsHigh
        # 假设 postgres max_connections=100（compose 未覆盖，官方默认）；
        # 80% = 80 连接。若未来调大 max_connections 需同步调整此阈值。
        expr: sum(pg_stat_database_numbackends) > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL connections above 80"
          description: "PostgreSQL is using {{ $value }} connections (80% of the default 100 budget)."

      - alert: DiskSpaceLow
        # 依赖 node-exporter（本任务新增服务，--path.rootfs=/host）。
        expr: >
          (1 - node_filesystem_avail_bytes{mountpoint="/"}
            / node_filesystem_size_bytes{mountpoint="/"})
          > 0.85
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Root filesystem above 85%"
          description: "Host root filesystem is {{ $value | humanizePercentage }} full (threshold 85%)."

      - alert: RedisMemoryHigh
        # redis-celery 为 noeviction：内存打满会导致消息/结果写入失败，
        # 比缓存 redis（allkeys-lru 可驱逐）更危险，两条序列独立评估。
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Redis memory above 85%"
          description: "Redis instance {{ $labels.redis_instance }} is using {{ $value | humanizePercentage }} of its maxmemory."

  # ------------------------------------------------------------------
  # Disaster recovery and alert delivery
  # ------------------------------------------------------------------
  - name: soymutdb-disaster-recovery
    rules:
      - alert: BackupStale
        expr: >
          (time() - soymutdb_backup_last_success_timestamp_seconds > 172800)
          or absent(soymutdb_backup_last_success_timestamp_seconds)
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "Authoritative backup is older than 48 hours"
          description: "No verified successful backup has been observed within the 48-hour recovery objective."

      - alert: BackupFailed
        expr: soymutdb_backup_status == 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Latest authoritative backup failed"
          description: "The latest backup attempt failed. Inspect backup logs and staging/offsite connectivity."

      - alert: AlertmanagerUnavailable
        expr: up{job="alertmanager"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Alertmanager is unavailable"
          description: "Prometheus cannot reach Alertmanager; external alert delivery is unavailable."

      - alert: AlertDeliveryFailed
        expr: increase(alertmanager_notifications_failed_total[10m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Alertmanager notification delivery failed"
          description: "Alertmanager reported {{ $value }} failed notification attempts in the last 10 minutes."
