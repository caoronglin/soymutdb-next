apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels:
    app.kubernetes.io/name: soymutdb-worker
    app.kubernetes.io/part-of: soymutdb-kind-smoke
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: soymutdb-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: soymutdb-worker
        app.kubernetes.io/part-of: soymutdb-kind-smoke
    spec:
      automountServiceAccountToken: false
      hostNetwork: false
      hostPID: false
      hostIPC: false
      securityContext:
        runAsNonRoot: true
        # Dockerfile uses the named `soymutdb` user. Pin its numeric identity
        # so kubelet can prove non-root execution before it starts the image.
        runAsUser: 1000
        runAsGroup: 1000
        # The /tmp emptyDir must be writable by the pinned non-root process.
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: soymutdb-worker:ci-amd64
          imagePullPolicy: Never
          ports:
            - name: metrics
              containerPort: 9808
          # An in-memory broker lets the genuine Celery worker reach a ready
          # state without declaring this small test harness a production queue.
          command:
            - celery
          args:
            - -A
            - soymutdb_worker.main:celery_app
            - worker
            - --loglevel=warning
            - --concurrency=1
            - --pool=solo
            - --without-gossip
            - --without-mingle
            - --without-heartbeat
          env:
            - name: SOYMUTDB_CELERY_BROKER_URL
              value: memory://
            - name: SOYMUTDB_CELERY_RESULT_BACKEND
              value: cache+memory://
            - name: PROMETHEUS_MULTIPROC_DIR
              value: /tmp/prometheus-multiproc
            - name: HOME
              value: /tmp
            - name: TMPDIR
              value: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: runtime-tmp
              mountPath: /tmp
          # Celery emits worker_ready only after it has initialised its broker
          # connection.  The signal starts the in-container Prometheus server,
          # so this verifies more than a still-running process.
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
      volumes:
        - name: runtime-tmp
          emptyDir:
            sizeLimit: 512Mi
