# =====================================================================
# SoyMutDB Admin Console — Container Nginx Config
# Listens only on port 80 within the Docker network (no host port exposure).
# Access is further restricted by IP allowlist at the reverse-proxy layer.
# =====================================================================

# HSTS is advertised only when TLS was terminated upstream: this container
# listens on plain HTTP behind the proxy/edge. The shared fragment references
# `$hsts_header_value`, so the variable must be defined here — an undefined
# variable is an `nginx: [emerg] unknown variable` startup failure, not a
# warning. The value keeps the pre-existing container policy (no `preload`);
# only the main proxy config, which terminates HTTP itself, uses `preload`.
map $http_x_forwarded_proto $hsts_header_value {
    default "";
    https   "max-age=31536000; includeSubDomains";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Admin-specific fragment: DENY framing, no-referrer, and `script-src 'self'`
    # (the admin entry HTML has no inline script). It is a separate file rather
    # than an override chain because nginx emits every same-named `add_header`
    # it sees — including the portal fragment and then overriding would send two
    # X-Frame-Options and two CSP headers.
    #
    # It must be included at the server level AND in every location below that
    # sets any header of its own, because nginx inherits `add_header` only when
    # the inner level declares none. This file's `location /` used to serve the
    # admin HTML with no XFO and no CSP at all, for exactly that reason.
    include /etc/nginx/conf.d/security-headers-admin.inc;

    # gzip for on-the-fly compression
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    # text/html is always compressed by nginx; naming it here only emits a
    # "duplicate MIME type" startup warning.
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml application/xml+rss image/svg+xml font/woff font/woff2;

    # Serve pre-compressed .gz files when available
    gzip_static on;

    # ----------------------------------------------------------------
    # Immutable hashed assets
    # ----------------------------------------------------------------
    # Quoted: an unquoted `{` in `{8,}` is parsed as a block opener and the
    # directive never starts.
    location ~* "\.[0-9a-f]{8,}\.(js|css|woff2?|svg|png|jpg|jpeg|gif|ico)$" {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/conf.d/security-headers-admin.inc;
        access_log off;
        try_files $uri =404;
    }

    # ----------------------------------------------------------------
    # Other static assets
    # ----------------------------------------------------------------
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public";
        include /etc/nginx/conf.d/security-headers-admin.inc;
        access_log off;
        try_files $uri =404;
    }

    # ----------------------------------------------------------------
    # SPA catch-all
    # ----------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        include /etc/nginx/conf.d/security-headers-admin.inc;
    }
}
