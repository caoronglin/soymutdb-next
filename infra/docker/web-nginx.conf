# =====================================================================
# SoyMutDB Web Frontend — Container Nginx Config
# Serves SPA + SSG sample pages with gzip_static, immutable asset caching,
# and security headers.
# =====================================================================

# HSTS is advertised only when TLS was terminated upstream: this container
# listens on plain HTTP behind the proxy/edge. The shared fragment references
# `$hsts_header_value`, so the variable must be defined here — an undefined
# variable is an `nginx: [emerg] unknown variable` startup failure, not a
# warning. The value keeps the pre-existing container policy (no `preload`).
map $http_x_forwarded_proto $hsts_header_value {
    default "";
    https   "max-age=31536000; includeSubDomains";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers — single source, shared with the main proxy config.
    # It must be included here AND in every location that declares any
    # `add_header`: nginx inherits `add_header` only when the inner level
    # declares none, so the SPA `location /` below used to drop XFO/CSP/nosniff
    # entirely (its own Cache-Control was enough to break inheritance) and the
    # portal HTML had no framing protection at all.
    # The fragment also carries HSTS, so the previous hand-written HSTS here is
    # gone; its value now comes from the map above.
    include /etc/nginx/conf.d/security-headers.inc;

    # gzip for on-the-fly compression (fallback when no .gz exists)
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    # text/html is always compressed by nginx; naming it here only emits a
    # "duplicate MIME type" startup warning.
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml application/xml+rss image/svg+xml font/woff font/woff2;

    # Serve pre-compressed .gz files when available
    gzip_static on;

    # ----------------------------------------------------------------
    # Immutable hashed assets (8+ hex char hash in filename)
    # ----------------------------------------------------------------
    # The regex is quoted: nginx's config tokenizer treats an unquoted `{` as
    # the start of a block, so `{8,}` split the directive and the container
    # died at startup with `unknown directive "8,}\.(...)$"`.
    location ~* "\.[0-9a-f]{8,}\.(js|css|woff2?|svg|png|jpg|jpeg|gif|ico)$" {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # nosniff comes from the fragment — re-declaring it would emit the
        # header twice.
        include /etc/nginx/conf.d/security-headers.inc;
        access_log off;
        try_files $uri =404;
    }

    # ----------------------------------------------------------------
    # /samples/ — static SSG sample HTML pages
    # These are pre-rendered HTML files served directly.
    # ^~ prevents regex asset locations from intercepting /samples/* paths
    # ----------------------------------------------------------------
    location ^~ /samples/ {
        try_files $uri $uri/ $uri/index.html /samples/index.html =404;
        expires 5m;
        add_header Cache-Control "public, max-age=300";
        include /etc/nginx/conf.d/security-headers.inc;
        gzip_static on;
    }

    # ----------------------------------------------------------------
    # Other static assets (non-hashed)
    # ----------------------------------------------------------------
    # pdf.js loads its worker as a module worker (`type: "module"`); browsers
    # reject module scripts/workers whose MIME type is not JavaScript. The
    # distro mime.types only maps `.js`, so declare `.mjs` explicitly. The file
    # name is not content-hashed, so keep the browser cache short: a pdfjs
    # upgrade must be able to replace the worker without a hard refresh.
    location ~* \.mjs$ {
        types {
            application/javascript mjs;
        }
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        include /etc/nginx/conf.d/security-headers.inc;
        access_log off;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public";
        include /etc/nginx/conf.d/security-headers.inc;
        access_log off;
        try_files $uri =404;
    }

    # ----------------------------------------------------------------
    # SPA catch-all — serve index.html for all routes
    # ----------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        # The portal's HTML response is the one that most needs framing
        # protection and nosniff; without this include it inherited nothing.
        include /etc/nginx/conf.d/security-headers.inc;
    }
}
