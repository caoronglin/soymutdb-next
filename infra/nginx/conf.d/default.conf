# =====================================================================
# SoyMutDB Default Server Configuration
# =====================================================================
# Security headers: CSP, HSTS, X-Frame-Options, X-Content-Type-Options,
#                   Referrer-Policy, Permissions-Policy
# Rate limiting:    API 100r/s, BLAST 1r/s
# Range support:    For BAM/CRAM/tabix genomic files
# CORS:             For JBrowse data fetching
# gzip_static:      Pre-compressed .gz assets (served from disk by upstreams)
# Admin IP ACL:     Private networks only for /admin/
# =====================================================================

server {
    listen 80;
    server_name _;

    # ----------------------------------------------------------------
    # Security headers
    # ----------------------------------------------------------------
    # Single source: infra/nginx/conf.d/security-headers.inc. It must be
    # included HERE and again in every location that declares any `add_header`
    # of its own, because nginx inherits `add_header` only when the inner level
    # declares none. See the fragment header for the full explanation.
    #
    # script-src 'unsafe-inline' is kept on this path only (dev/self-hosted
    # nginx). Production portal HTML is served by Cloudflare Pages / gh-pages
    # with a build-generated policy that uses per-page inline-script hashes —
    # see apps/web/scripts/finalize-csp.ts and
    # docs/ops/static-hosting-security.md.
    include /etc/nginx/conf.d/security-headers.inc;

    # Connection limits
    limit_conn conn_limit 50;

    # ----------------------------------------------------------------
    # /track.gif — analytics pixel endpoint (exact match, highest priority)
    # No caching, no rate limiting, CORS open
    # ----------------------------------------------------------------
    location = /track.gif {
        proxy_pass http://api_backend/api/v1/track.gif;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id_to_forward;

        add_header Cache-Control "no-cache, no-store, must-revalidate, private" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header Access-Control-Allow-Origin "*" always;
        include /etc/nginx/conf.d/security-headers.inc;

        proxy_buffering off;
        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
        access_log off;
    }

    # ----------------------------------------------------------------
    # Health & metrics (no rate limit)
    # ----------------------------------------------------------------
    location = /health {
        proxy_pass http://api_backend/api/v1/health/live;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id_to_forward;
        access_log off;
    }

    location ^~ /metrics {
        # Restrict metrics to private networks
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;

        proxy_pass http://api_backend/metrics;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id_to_forward;
        access_log off;
    }

    # ----------------------------------------------------------------
    # Admin console — IP-restricted (private networks only)
    # ^~ prevents regex asset locations from intercepting /admin/* paths
    # ----------------------------------------------------------------
    location ^~ /admin/ {
        # IP allowlist: localhost + private RFC1918 ranges
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;

        proxy_pass http://admin_app/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id_to_forward;
    }

    # ----------------------------------------------------------------
    # /samples/ — static sample HTML pages (SSG output from web frontend)
    # ^~ ensures sample pages aren't intercepted by asset regex locations
    # ----------------------------------------------------------------
    location ^~ /samples/ {
        proxy_pass http://web_frontend/samples/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Sample pages are HTML, cache briefly
        expires 5m;
        add_header Cache-Control "public, max-age=300";
        include /etc/nginx/conf.d/security-headers.inc;
    }

    # ----------------------------------------------------------------
    # /pages/ — StaticPage SSG output from the public web frontend.
    # ^~ is required so asset regex locations cannot intercept page paths.
    # Keep this block header-free: server-level security headers must inherit.
    # ----------------------------------------------------------------
    location ^~ /pages/ {
        proxy_pass http://web_frontend/pages/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id_to_forward;
    }

    # ----------------------------------------------------------------
    # API - FastAPI backend (100 r/s)
    # ^~ ensures /api/* paths are not intercepted by asset regex
    # ----------------------------------------------------------------
    location ^~ /api/ {
        limit_req zone=api burst=200 nodelay;

        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Request-ID $request_id_to_forward;

        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # API responses are private by default.  Do not cache authenticated or
        # cookie-bearing requests, and let an explicitly configured upstream
        # Cache-Control header govern any future public-cache allowlist.
        proxy_no_cache $has_authorization $has_cookie;
        proxy_cache_bypass $has_authorization $has_cookie;
        proxy_cache off;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/conf.d/security-headers.inc;
    }

    # ----------------------------------------------------------------
    # BLAST API - CPU-intensive (1 r/s) - more specific than /api/
    # ----------------------------------------------------------------
    location ^~ /api/v1/blast/ {
        limit_req zone=blast burst=5 nodelay;

        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id_to_forward;

        proxy_connect_timeout 10s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    # ----------------------------------------------------------------
    # Auth endpoints - stricter rate limiting - more specific than /api/
    # ----------------------------------------------------------------
    location ^~ /api/v1/auth/ {
        limit_req zone=auth burst=20 nodelay;

        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id_to_forward;
    }

    # ----------------------------------------------------------------
    # JBrowse genome browser
    # ----------------------------------------------------------------
    location ^~ /browser/ {
        proxy_pass http://jbrowse_app/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id_to_forward;
    }

    # ----------------------------------------------------------------
    # Genomic data files (direct from MinIO/S3, with Range support)
    # ----------------------------------------------------------------
    location ^~ /data/ {
        proxy_pass http://minio_backend/genomic-data/;
        # Keep Range/MinIO semantics out of nginx proxy cache; browser/CDN caching is explicit below.
        proxy_cache off;
        proxy_set_header X-Request-ID $request_id_to_forward;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_hide_header x-amz-id-2;
        proxy_hide_header x-amz-request-id;

        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;

        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Range, Content-Type" always;
        add_header Access-Control-Expose-Headers "Content-Range, Content-Length, Accept-Ranges" always;
        add_header Cache-Control "public, max-age=86400, immutable";
        include /etc/nginx/conf.d/security-headers.inc;
    }

    # ----------------------------------------------------------------
    # Keep deployed subpath applications ahead of generic asset regexes.
    # ^~ prevents nginx regex locations from intercepting their assets.
    location ^~ /soymutdb-admin/ {
        proxy_pass http://admin_app/;
        proxy_http_version 1.1; proxy_set_header Connection "";
        proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Request-ID $request_id_to_forward;
    }
    location ^~ /soymutdb-jbrowse/ {
        proxy_pass http://jbrowse_app/;
        proxy_http_version 1.1; proxy_set_header Connection "";
        proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Request-ID $request_id_to_forward;
    }

    # Immutable hashed assets (js/css/woff2 with 8+ hex char hash)
    # These belong to the web frontend (catch-all domain).
    # gzip compression enabled for proxied responses.
    # ----------------------------------------------------------------
    # Quoted: nginx tokenizes an unquoted `{` as a block opener, so the `{8,}`
    # quantifier would split the directive and fail `nginx -t`.
    location ~* "\.[0-9a-f]{8,}\.(js|css|woff2?)$" {
        gzip_static on;
        proxy_pass http://web_frontend;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        # nosniff comes from security-headers.inc (included below) — do not
        # re-declare it here or nginx emits the header twice.
        include /etc/nginx/conf.d/security-headers.inc;
        access_log off;
    }

    # ----------------------------------------------------------------
    # Other static assets (non-hashed, served by web frontend)
    # ----------------------------------------------------------------
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|ttf|eot)$ {
        gzip_static on;
        proxy_pass http://web_frontend;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public";
        include /etc/nginx/conf.d/security-headers.inc;
        access_log off;
    }

    # ----------------------------------------------------------------
    # MCP Server - Streamable HTTP / SSE (oracle R3 mandatory)
    # Buffering MUST be off, otherwise nginx buffers the upstream SSE
    # stream until disconnect and truncates messages; the long read
    # timeout keeps long-lived streams (and BLAST polling) alive.
    # ----------------------------------------------------------------
    # Accept the slash variant only through the same bearer boundary, then
    # redirect POST clients to FastMCP's canonical /mcp endpoint.
    location = /mcp/ {
        if ($http_authorization = "") { return 401; }
        return 308 /mcp;
    }
    location = /mcp {
        # Presence check only: the application validates the bearer secret.
        # Do not put the secret in nginx config, and keep /health independent.
        if ($http_authorization = "") { return 401; }
        limit_req zone=auth burst=10 nodelay;
        proxy_pass http://mcp-local:9000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id_to_forward;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 10s;
    }

    # ----------------------------------------------------------------
    # Public site (catch-all)
    # ----------------------------------------------------------------
    location / {
        gzip_static on;
        proxy_pass http://web_frontend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id_to_forward;
    }

    # ----------------------------------------------------------------
    # Error pages
    # ----------------------------------------------------------------
    error_page 429 = @ratelimit;
    location @ratelimit {
        add_header Content-Type application/json;
        include /etc/nginx/conf.d/security-headers.inc;
        return 429 '{"error":"rate_limit_exceeded","message":"Too many requests. Please slow down."}';
    }

    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}
