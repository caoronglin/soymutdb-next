# Dedicated Cloudflare Tunnel origin. It deliberately serves neither frontend
# assets nor administration routes. Cloudflare terminates public TLS; this
# container only accepts private HTTP from the cloudflared connector.

worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;
    error_log /dev/stderr warn;
    sendfile on;
    client_max_body_size 500m;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;

    upstream api_backend {
        server api:8000;
        keepalive 16;
    }

    upstream minio_backend {
        server minio:9000;
        keepalive 16;
    }

    server {
        listen 8081;
        server_name _;

        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # This route is the deployment and end-to-end Tunnel probe. It exposes
        # no readiness details, metrics, storage UI, or application data.
        location = /health {
            proxy_pass http://api_backend/api/v1/health/live;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Request-ID $request_id;
            access_log off;
        }

        # The public Tunnel is for the portal's public API/data plane only.
        # Admin operations use a separately protected origin and must never be
        # reachable through this hostname, even with a valid application token.
        location = /api/v1/admin {
            return 404;
        }

        location ^~ /api/v1/admin/ {
            return 404;
        }

        # API requests retain the public host and Cloudflare's client-IP hint.
        # The connector is the only intended peer on the cloudflare-edge
        # network; do not publish this service to a host port.
        location ^~ /api/ {
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $http_cf_connecting_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_connect_timeout 10s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
            proxy_cache off;
            add_header Cache-Control "no-store" always;
        }

        # The deployed JBrowse app defaults to /jbrowse-data. Keep /data as a
        # compatible alias for existing direct-nginx deployments. Both map only
        # to the public genomic-data bucket, never the MinIO console or private
        # buckets.
        location ^~ /jbrowse-data/ {
            proxy_pass http://minio_backend/genomic-data/;
            proxy_set_header Host $host;
            proxy_set_header Range $http_range;
            proxy_set_header If-Range $http_if_range;
            proxy_buffering off;
            proxy_hide_header x-amz-id-2;
            proxy_hide_header x-amz-request-id;
            add_header Access-Control-Allow-Origin "$http_origin" always;
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Range, Content-Type" always;
            add_header Access-Control-Expose-Headers "Content-Range, Content-Length, Accept-Ranges" always;
            add_header Cache-Control "public, max-age=86400, immutable" always;
        }

        location ^~ /data/ {
            proxy_pass http://minio_backend/genomic-data/;
            proxy_set_header Host $host;
            proxy_set_header Range $http_range;
            proxy_set_header If-Range $http_if_range;
            proxy_buffering off;
            proxy_hide_header x-amz-id-2;
            proxy_hide_header x-amz-request-id;
            add_header Access-Control-Allow-Origin "$http_origin" always;
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Range, Content-Type" always;
            add_header Access-Control-Expose-Headers "Content-Range, Content-Length, Accept-Ranges" always;
            add_header Cache-Control "public, max-age=86400, immutable" always;
        }

        # Fail closed: admin, MinIO console, monitoring, MCP, frontend assets,
        # and every other internal path are unreachable through the Tunnel.
        location / {
            return 404;
        }
    }
}
