# =====================================================================
# SoyMutDB Nginx Main Configuration
# =====================================================================
# Features:
#   - gzip compression
#   - rate limiting (API 100r/s, BLAST 1r/s)
#   - browser cache controls (API proxy caching is disabled by default)
#   - security headers (CSP, HSTS, X-Frame-Options, etc.)
#   - Range request support for genomic files
#   - CORS for JBrowse data fetching
# =====================================================================

worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ----------------------------------------------------------------
    # Core
    # ----------------------------------------------------------------
    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    server_tokens off;
    client_max_body_size 500m;
    client_body_buffer_size 128k;
    large_client_header_buffers 4 16k;

    # ----------------------------------------------------------------
    # Logging
    # ----------------------------------------------------------------
    # Server-Sent Events are the one request whose query string carries a
    # credential: the browser `EventSource` API cannot send headers, so
    # `GET /api/v1/jobs/events?ticket=...` authenticates with a single-use
    # ticket in the URL. `$request` would copy it verbatim into the access log,
    # so the SSE path is logged as method + path + protocol with no arguments.
    # Every other path keeps logging `$request` byte for byte.
    map $uri $logged_request {
        default                 $request;
        "~^/api/v1/jobs/events"  "$request_method $uri $server_protocol";
    }

    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$logged_request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # ----------------------------------------------------------------
    # Brotli is intentionally absent: stock nginx:1.27-alpine has no Brotli module.
    # HTTP/2 is not enabled because this deployment has no TLS certificate/listen wiring.

    # Gzip compression
    # ----------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    # text/html is always compressed by nginx; listing it here only warns
    # about a duplicate MIME type at startup.
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/xhtml+xml
        application/x-www-form-urlencoded
        image/svg+xml
        font/woff
        font/woff2
        application/font-woff
        application/font-woff2;

    # Serve pre-compressed .gz files when available
    gzip_static on;

    # ----------------------------------------------------------------
    # Rate limiting zones
    # API: 100 requests/sec per IP
    # BLAST: 1 request/sec per IP (CPU-intensive)
    # ----------------------------------------------------------------
    limit_req_zone $binary_remote_addr zone=api:10m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=blast:10m rate=1r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/s;

    limit_req_status 429;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # ----------------------------------------------------------------
    # Forwarded request IDs and transport security
    # ----------------------------------------------------------------
    # Preserve a trusted edge ID when supplied; otherwise use Nginx's
    # per-request ID so the API always receives one.
    #
    # The client value is accepted only when it matches a strict charset and
    # length. An unvalidated `$http_x_request_id` is attacker-controlled text
    # that lands in the access log and in an upstream header, so CR/LF or quote
    # injection would forge log lines. Anything else falls back to the
    # server-generated `$request_id`.
    map $http_x_request_id $request_id_to_forward {
        default                  $request_id;
        # Quoted: an unquoted `{1,64}` is tokenized as a block opener and
        # `nginx -t` stops with `unexpected "{"`.
        "~^[A-Za-z0-9._-]{1,64}$"  $http_x_request_id;
    }

    # HSTS is emitted only when this server is reached over HTTPS.  The
    # default deployment listens on HTTP and must not advertise HSTS there.
    map $scheme $hsts_header_value {
        default "";
        https   "max-age=31536000; includeSubDomains; preload";
    }

    # Keep these variables numeric for proxy_no_cache/proxy_cache_bypass while
    # still documenting the sensitive request headers that must never be cached.
    map $http_authorization $has_authorization {
        default 1;
        ""      0;
    }
    map $http_cookie $has_cookie {
        default 1;
        ""      0;
    }

    # ----------------------------------------------------------------
    # SSL defaults (when TLS is enabled)
    # ----------------------------------------------------------------
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ----------------------------------------------------------------
    # Upstreams
    # ----------------------------------------------------------------
    upstream api_backend   { server api-local:8010; keepalive 32; }
    upstream web_frontend  { server web:80;   keepalive 16; }
    upstream admin_app     { server admin:80; keepalive 16; }
    upstream jbrowse_app   { server jbrowse:80; keepalive 16; }
    upstream minio_backend { server minio-local:9000; keepalive 16; }

    # ----------------------------------------------------------------
    # Include server blocks
    # ----------------------------------------------------------------
    include /etc/nginx/conf.d/*.conf;
}
