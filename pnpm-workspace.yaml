packages:
  - "packages/*"
  - "apps/*"

# CI and developers install explicitly; warn about stale node_modules instead
# of mutating dependencies implicitly before every script.
verifyDepsBeforeRun: warn

# Shared platform versions. Consumers opt in with the `catalog:` protocol so a
# framework-line change remains one reviewed workspace decision.
catalog:
  react: 19.2.0
  react-dom: 19.2.0
  typescript: 5.9.3
  vite: 6.4.3
  antd: 6.6.1

# pnpm 11: workspace-level settings live here (the root package.json "pnpm"
# field is no longer read). Overrides force the exact React 19.2.0 build for
# every transitive peer, so @ant-design/* and @soymutdb/* share a single React
# runtime with no React downgrade.
overrides:
  react: 19.2.0
  react-dom: 19.2.0
  librpc-web-mod: 1.3.0
  rxjs: 7.8.0
  # Security floors for transitive production/development utility packages.
  lodash: 4.18.1
  ansi-regex: 5.0.1
  # GHSA-2883-xcg3-v3hh: `maxTotalMergeKeys` does not bound CPU use on empty
  # merge sources. Reached through openapi-typescript -> @redocly/openapi-core.
  js-yaml: 4.3.2

allowBuilds:
  # Vite's platform-specific binary is required at build time. All other
  # dependency lifecycle scripts remain denied by default.
  esbuild: true
