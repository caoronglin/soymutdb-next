packages:
  - "packages/*"
  - "apps/*"

# CI and developers install explicitly; warn about stale node_modules instead
# of mutating dependencies implicitly before every script.
verifyDepsBeforeRun: warn

# Shared platform versions. Consumers opt in with the `catalog:` protocol so a
# framework-line change remains one reviewed workspace decision.
catalog:
  react: 19.2.0
  react-dom: 19.2.0
  typescript: 5.9.3
  vite: 6.4.3
  antd: 6.6.1
  # Vue frontend mainline (plan.md §2). Latest stable, exact-pinned here so a
  # framework-line change stays one reviewed workspace decision (Phase D).
  vue: 3.5.43
  '@vitejs/plugin-vue': 6.0.9
  # Keep the new Vue app on the workspace Vitest line (no second major).
  vitest: 3.2.7
  # Vue mainline stack (plan.md §2): Router + Pinia 4 + TanStack Vue Query,
  # latest stable, exact-pinned (Phase D Checkpoint B). VueUse 15 joins the
  # catalog with the first page that uses it: knip fails an unused dependency,
  # and plan.md §24 forbids replacing simple ref/computed just to justify it.
  vue-router: 5.3.1
  pinia: 4.0.3
  '@tanstack/vue-query': 5.103.2
  # Vue UI layer (Phase D Checkpoint D): Antdv Next 1.x (via the @soymutdb/ui-vue
  # facade only), Tailwind CSS 4 + its Vite plugin. Exact-pinned; Antdv Next may
  # break on minor, so upgrades go through the facade contract test first.
  antdv-next: 1.5.4
  tailwindcss: 4.3.3
  '@tailwindcss/vite': 4.3.3

# pnpm 11: workspace-level settings live here (the root package.json "pnpm"
# field is no longer read). Overrides force the exact React 19.2.0 build for
# every transitive peer, so @ant-design/* and @soymutdb/* share a single React
# runtime with no React downgrade.
overrides:
  react: 19.2.0
  react-dom: 19.2.0
  librpc-web-mod: 1.3.0
  rxjs: 7.8.0
  # Security floors for transitive production/development utility packages.
  lodash: 4.18.1
  ansi-regex: 5.0.1
  # GHSA-2883-xcg3-v3hh: `maxTotalMergeKeys` does not bound CPU use for empty
  # merge sources. Reached through api-client -> openapi-typescript ->
  # @redocly/openapi-core.
  js-yaml: 4.3.2

allowBuilds:
  # Vite's platform-specific binary is required at build time. All other
  # dependency lifecycle scripts remain denied by default.
  esbuild: true
  # vue-demi is the Vue 2/3 switch shim that runtime VueUse expects; its
  # postinstall selects the installed Vue. Required for the Vue mainline.
  vue-demi: true

# pnpm 12 supply-chain: minimumReleaseAge refuses packages younger than its
# window; the pinned TanStack Vue Query (latest stable, plan §2) was published
# inside it, so those two packages are exempted explicitly here.
minimumReleaseAgeExclude:
  - "@tanstack/query-core@5.103.2"
  - "@tanstack/vue-query@5.103.2"

# Charts (plan §2.3): TanStack Charts is pre-1.0, so its pins live in their own
# catalog and are consumed by @soymutdb/charts only. Upgrades go through one
# minor at a time, behind that facade's contract test.
catalogs:
  charts:
    '@tanstack/vue-charts': 0.18.0
    '@tanstack/charts': 0.18.0
