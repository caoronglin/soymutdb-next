packages:
  - "packages/*"
  - "apps/*"

# CI and developers install explicitly; warn about stale node_modules instead
# of mutating dependencies implicitly before every script.
verifyDepsBeforeRun: warn

# Applications and shared UI use one catalog-pinned React runtime. Disable
# implicit peer installation so every app declares its runtime dependencies.
autoInstallPeers: false

# Shared platform versions. Consumers opt in with the `catalog:` protocol so a
# framework-line change remains one reviewed workspace decision.
catalog:
  typescript: 5.9.3
  vite: 8.3.4
  # React Pro v6 frontend line; exact pins shared by all three applications.
  '@umijs/max': 4.7.24
  react: 19.3.1
  react-dom: 19.3.1
  # @types/react(-dom) 19.3.1 is not published; keep 19.3.0 until it is.
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  antd: 6.6.6
  # A1 measurement slice: exact pin verified against the registry `latest`
  # (2.6.8, published 2025-12-24, MIT, AntV maintainers). Only the React 19
  # feasibility smoke test imports it, so `@soymutdb/charts` keeps it as a
  # devDependency; the production engine is `@antv/g2` via `g2-runtime`.
  '@ant-design/plots': 2.6.8
  '@ant-design/pro-components': 3.1.15-2
  vitest: 5.0.5
  tailwindcss: 4.3.3
  '@tailwindcss/vite': 4.3.3

# Workspace-level pnpm settings live here. React and ReactDOM are resolved
# through the shared catalog so all React applications and facades use one
# runtime version; targeted overrides below address audited transitive floors.
overrides:
  librpc-web-mod: 1.3.0
  rxjs: 7.8.0
  # Security floors for transitive production/development utility packages.
  lodash: 4.18.1
  ansi-regex: 5.0.1
  # GHSA-2883-xcg3-v3hh: `maxTotalMergeKeys` does not bound CPU use for empty
  # merge sources. Reached through api-client -> openapi-typescript ->
  # @redocly/openapi-core.
  js-yaml: 4.3.2
  # Umi Max 4.7.24 carries older transitive ranges; these compatible floors
  # remove known advisories without replacing the React/Ant Design majors.
  # GHSA-x97p-jq2g-jp4f. Resolve and integration-test in the lock candidate job.
  axios: 0.34.0
  immer: 9.0.6
  node-fetch: 2.7.0
  # GHSA-q3jh-wrc6-jgq8 / GHSA-8r9p-f939-6h3c: follow-redirects < 1.16.1 strips
  # credential headers from cross-origin redirects with a routine that misses
  # array-form headers and mis-escapes caller-declared sensitiveHeaders, so
  # Authorization/Cookie can reach an attacker-controlled host. Reached through
  # axios (Umi's dev proxy), which this workspace floors at 0.34.0.
  follow-redirects: 1.16.1
  # GHSA-5r4p-p66f-jhc7: hono < 4.13.11 decodes the request path a second time
  # in serveStatic, so a crafted path can be routed as one path and served as
  # another and middleware on a static prefix does not run. Reached through
  # @utoo/pack (the Umi 4 bundler).
  hono: 4.13.11
  "path-to-regexp@^1.7.0": 1.9.0
  "path-to-regexp@^8.0.0": 8.4.2
  # GHSA-68fv-2mgg-jv7q and GHSA-85c8-ppgw-ccpr; verify Vitest pools.
  source-map-js: 1.2.2
  tinypool: 2.1.2
  esbuild: 0.28.2
  "@babel/core": 7.29.7
  "@babel/runtime": 7.29.7
  "react-router@6": 6.30.6
  "react-router-dom@6": 6.30.6
  "@remix-run/router": 1.23.3
  decode-uri-component: 0.5.0
  # GHSA-rj75-hqrm-r3gf: ReDoS through crafted CSS selectors. The vulnerable
  # 6.x copy is reached through Umi's postcss-preset-env; 7.1.6 is the patched
  # floor and the plugins only use the stable parse/walk API.
  "postcss-selector-parser@<7.1.6": 7.1.6
  # GHSA-477h-4r7f-fvrx: the crypto-browserify shim (bundler-only) pins an
  # older KDF; 3.1.7 is a patch-level floor.
  pbkdf2: 3.1.7
  # GHSA-hp3w-g68c-fv3c (ReDoS): no patched release exists yet (the advisory
  # covers <=1.1.3); 1.1.3 is the current latest, still better than the 1.0.3
  # Umi/mammoth chain resolved. Recheck when upstream publishes a fix.
  sprintf-js: 1.1.3
  # GHSA-587h-7wmj-h5pm (and GHSA-698v-4r3x-3vcv, GHSA-r825-w8mm-5pxw,
  # GHSA-rq7h-c2jc-7f22, GHSA-9jrq-w75r-8gcw): the vulnerable `vite` 7.x
  # (<=7.3.6) is reached in this tree through exactly one dependency edge,
  # `@umijs/bundler-vite` -> `vite`. A workspace-wide `vite` override was
  # rejected because it also rewrites the `vite` peer declarations of
  # `vitest` 5.0.5 and `@vitejs/plugin-react`, whose range already allows
  # vite 7 while their resolved edge stays on the catalog's vite 8.3.4.
  # The `parent>child` selector below pins only that one edge to the patched
  # 7.3.7; the peer *ranges* stay untouched and the resolved vite 8.3.4 edge
  # of vitest is unaffected.
  "@umijs/bundler-vite>vite": 7.3.7
  # GHSA-27r3-jxmh-p828: body-parser < 1.20.9 leaves the decompression stream
  # piped with no error listener, so trailing bytes after a compressed body
  # raise an uncaught exception and terminate the process. Parsing runs before
  # routing, so no authentication and no matching route is required. Reached
  # through express (dev-server bundlers only). 1.20.9 is a same-major patch
  # whose dependency set and engines are identical to 1.20.8, and it satisfies
  # express's declared `~1.20.5` range; the package has no peer edges.
  body-parser: 1.20.9
  # GHSA-w74x-v6f9-j3xg, GHSA-wjr9-j795-jxcr, GHSA-xhq7-xmqj-769h and
  # GHSA-333x-w4r6-6crp: fast-uri < 3.1.9 (scheme spoofing, host confusion,
  # relative-path equivalence, suffix scheme injection). Reached through ajv
  # <- table <- stylelint (lint-time only; stylelint is never invoked here).
  # 3.1.9 is a same-major patch with identical exports and types, it satisfies
  # ajv's declared `^3.0.1` range, and the package has no peer edges.
  fast-uri: 3.1.9

allowBuilds:
  # Umi/Vite-compatible bundling requires esbuild's platform binary.
  esbuild: true
  # Reviewed postinstall scripts only print notices; no build output is needed.
  core-js: false
  core-js-pure: false
  es5-ext: false

# pnpm 12 supply-chain: minimumReleaseAge refuses packages younger than its
# window; the ProComponents pin was published inside it, so that exact package
# is exempted explicitly here.
minimumReleaseAgeExclude:
  - "@tanstack/query-core@5.103.2"
  - "@ant-design/pro-components@3.1.15-2"
  - '@tanstack/react-router@1.170.44'
  - '@tanstack/router-core@1.171.37'
  - '@testing-library/user-event@14.6.8'
  - '@typescript-eslint/eslint-plugin@8.71.2'
  - '@typescript-eslint/parser@8.71.2'
  - '@typescript-eslint/project-service@8.71.2'
  - '@typescript-eslint/scope-manager@8.71.2'
  - '@typescript-eslint/tsconfig-utils@8.71.2'
  - '@typescript-eslint/type-utils@8.71.2'
  - '@typescript-eslint/types@8.71.2'
  - '@typescript-eslint/typescript-estree@8.71.2'
  - '@typescript-eslint/utils@8.71.2'
  - '@typescript-eslint/visitor-keys@8.71.2'
  - '@umijs/ast@4.7.24'
  - '@umijs/babel-preset-umi@4.7.24'
  - '@umijs/bundler-esbuild@4.7.24'
  - '@umijs/bundler-utils@4.7.24'
  - '@umijs/bundler-utoopack@4.7.24'
  - '@umijs/bundler-vite@4.7.24'
  - '@umijs/bundler-webpack@4.7.24'
  - '@umijs/core@4.7.24'
  - '@umijs/lint@4.7.24'
  - '@umijs/max@4.7.24'
  - '@umijs/mfsu@4.7.24'
  - '@umijs/plugin-run@4.7.24'
  - '@umijs/plugins@4.7.24'
  - '@umijs/preset-umi@4.7.24'
  - '@umijs/renderer-react@4.7.24'
  - '@umijs/server@4.7.24'
  - '@umijs/test@4.7.24'
  - '@umijs/utils@4.7.24'
  - '@umijs/zod2ts@4.7.24'
  - '@utoo/pack-darwin-arm64@1.5.26'
  - '@utoo/pack-darwin-x64@1.5.26'
  - '@utoo/pack-linux-arm64-gnu@1.5.26'
  - '@utoo/pack-linux-arm64-musl@1.5.26'
  - '@utoo/pack-linux-x64-gnu@1.5.26'
  - '@utoo/pack-linux-x64-musl@1.5.26'
  - '@utoo/pack-shared@1.5.26'
  - '@utoo/pack-win32-x64-msvc@1.5.26'
  - '@utoo/pack@1.5.26'
  - dompurify@3.4.17
  - marked@18.1.1
  - postcss@8.5.30
  - typescript-eslint@8.71.2
  - umi@4.7.24
  - react-i18next@17.0.21

catalogs:
  # Framework-neutral genome readers over the same /jbrowse-data files.
  # Exact pins keep the data layer independent of JBrowse's transitive tree.
  genomics:
    '@gmod/bbi': 5.0.0
    '@gmod/bam': 4.0.1
    '@gmod/bgzf-filehandle': 1.4.4
    '@gmod/indexedfasta': 2.0.2
    '@gmod/tabix': 1.5.6
    '@gmod/trix': 2.0.9
    '@gmod/vcf': 5.0.9
    generic-filehandle: 3.4.0
