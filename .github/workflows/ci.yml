# =============================================================================
# SoyMutDB Next — CI/CD (build & verify pipeline)
#
# Trigger  : push to main + all pull requests
# Jobs     :
#   frontend    — pnpm install, build, bundle budget, unit tests, lint,
#                 typecheck, and OpenAPI contract checks (all hard gates),
#                 then upload dist artifacts for deployment
#   api-tests   — Python 3.15 venv + full pytest tree (hard gate, including A0
#                 and testcontainers integration), Ruff (non-blocking), worker
#                 analysis deps install + import verification (hard gate)
#   dependency-governance— normalized pnpm/uv/Compose/OCI graphs plus blocking
#                 unused/dependency/cycle/version/license/vulnerability audits
#   docker-build— after all other hard gates pass, independently build API /
#                 Worker / MCP / JBrowse on native amd64 and arm64 runners;
#                 smoke, scan, generate SPDX, and export exact image packages
#   publish-images— on main only, load both verified packages, merge exact
#                   platform manifests, keyless-sign/attest them, and publish a
#                   source-bound release manifest without rebuilding
#
# Ruff remains non-blocking until the Python baseline is reduced. Frontend
# build/test/lint/typecheck/contract and the full API pytest tree are blocking.
#
# Actions are pinned to commit SHAs (trailing comments record the tag) and
# Node is pinned to an exact release for reproducibility. The Deploy Web to
# Pages workflow consumes this workflow via workflow_run and only publishes
# after it succeeds on main (see pages.yml).
#
# NOTE: the repo's .npmrc points at npmmirror; CI explicitly overrides the
# registry to https://registry.npmjs.org/ (official) before installing.
#
# MIRROR NOTICE (read before editing)
#   The authoritative delivery pipeline is `.cnb.yml`. This workflow is a mirror
#   for contributors who open pull requests on GitHub. To keep the two providers
#   from drifting, every job body here is a call into a checked-in script:
#
#     frontend              -> scripts/verify-frontend-artifacts.sh
#     api-tests             -> scripts/verify-backend-tests.sh
#     dependency-governance -> scripts/ci-job-steps.sh run dependency-governance
#     clickhouse-migration  -> scripts/ci-job-steps.sh run clickhouse-migration
#     mcp-e2e               -> scripts/ci-job-steps.sh run mcp-e2e
#     docker-build          -> scripts/build-release-image.sh
#     publish-images        -> scripts/release-contract.golden.sh
#
#   Do not inline new build/test/scan logic here. Add it to the shared script so
#   CNB and GitHub execute the same bytes. scripts/test_ci_job_contracts.py
#   enforces the delegation.
# =============================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  # ---------------------------------------------------------------------------
  # Job 1 — Frontend: install, build, contract check, artifacts
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend build + contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - name: Install pnpm 12
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          # Must match package.json "packageManager" exactly.
          version: 12.11.2

      - name: Setup Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26.13.0
          # Cache the pnpm store; key is derived from pnpm-lock.yaml.
          cache: pnpm

      # Turbo task cache (.turbo) — avoids full rebuilds on every CI run.
      - name: Cache Turbo build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Setup Python 3.15
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.15"

      # check-contract.sh exports the backend OpenAPI document using
      # apps/api/.venv/bin/python, so the venv must exist before the contract
      # gate inside scripts/verify-frontend-artifacts.sh runs. The install plan
      # (workspace distributions -> app) is shared with CNB and local runs.
      - name: Prepare API venv (for OpenAPI export)
        run: |
          python scripts/install_python_workspace.py \
            --venv apps/api/.venv --upgrade-pip --expect-version "3.15" apps/api

      - name: Use official npm registry
        run: pnpm config set registry https://registry.npmjs.org/

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # Ordered, blocking gates — the exact sequence the CNB pipeline runs.
      - name: Frontend verification (scripts/verify-frontend-artifacts.sh)
        env:
          # CI has no published release API.  Use the explicit demo fixture for
          # sample SSG instead of attempting to fetch the placeholder origin.
          # The PRODUCTION path is a separate, strict build that requires a
          # reachable release API and is gated by check-production-artifact.sh
          # with NO --allow-demo. See docs/ops/production-build.md.
          VITE_DEPLOYMENT_MODE: demo
          VITE_API_BASE_URL: https://api.soymutdb.test
          VITE_JBROWSE_BASE_URL: https://jbrowse.soymutdb.test
        run: bash scripts/verify-frontend-artifacts.sh

      # Pages deploys the exact static tree checked here.  It must not rebuild
      # a verified commit later with a different environment or toolchain.
      - name: Build GitHub Pages demo artifact (deploy input)
        env:
          SOYMUTDB_SITE_SLUG: ${{ github.event.repository.name }}
          SOYMUTDB_SITE_ORIGIN: https://${{ github.repository_owner }}.github.io
        run: |
          bash scripts/build-pages-artifact.sh
          bash scripts/verify-pages-artifact.sh pages-dist

      - name: Upload GitHub Pages demo artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pages-demo-dist
          path: pages-dist
          if-no-files-found: error
          include-hidden-files: true
          # Compress: this tree is the Pages deploy input, not a byte-for-byte
          # upload (GitHub stores the archive and the downloader unpacks it).
          # Uncompressed it burned ~36 MB of the 500 MB account quota per push.
          compression-level: 6
          retention-days: 7

      # Dual-site boundary: build the internal variant from the same commit and
      # prove it cannot leak into the external artifact (AGENTS.md; the build
      # and isolation checks live in the shared script so CNB runs them too).
      # The frontend gate above already built both variants, so reuse them.
      - name: Dual-site artifacts (external/internal isolation)
        env:
          SOYMUTDB_SITE_VARIANTS_PREBUILT: "1"
        run: bash scripts/verify-site-variant-artifacts.sh

      # The web/admin/jbrowse dist trees were uploaded purely as evidence; no
      # workflow downloads them (Pages consumes pages-demo-dist, the baseline
      # job builds its own, and the artifact contract runs before upload).
      # They cost ~35 MB of the account artifact quota per push, so the
      # verification stays and the duplicate uploads are gone. Use
      # `pnpm build` locally or the Pages artifact for inspection.

  # ---------------------------------------------------------------------------
  # Job 2 — API: Python venv + pytest (testcontainers on runner docker)
  # ---------------------------------------------------------------------------
  api-tests:
    name: API tests (pytest + testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - name: Setup Python 3.15
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - name: Install API dependencies (official PyPI)
        run: |
          python scripts/install_python_workspace.py \
            --venv apps/api/.venv --upgrade-pip --expect-version "3.15" "apps/api[dev]"

      # Ruff was red from a Makefile path bug (`apps/api/src` never existed,
      # so the API was never linted) plus 334 pre-existing findings. All of it
      # is fixed, so this is a blocking gate now — if it goes red, it is a new
      # finding rather than the old baseline. The Makefile fix is what made the
      # difference visible in the first place.
      - name: Ruff (blocking)
        working-directory: apps/api
        run: .venv/bin/ruff check app

      # Ordered, blocking gates — the exact sequence the CNB pipeline runs.
      # testcontainers-postgres boots a real postgres:16-alpine container on the
      # runner's docker daemon, so the worker integration matrix is a hard gate
      # instead of a skip-green. scripts/verify-backend-tests.sh sets
      # SOYMUTDB_RUN_POSTGRES_INTEGRATION=1 itself.
      - name: Backend verification (scripts/verify-backend-tests.sh)
        run: bash scripts/verify-backend-tests.sh

  # ---------------------------------------------------------------------------
  # W6 — database A/B harness reproducibility gate (NOT a performance benchmark)
  # ---------------------------------------------------------------------------
  db-ab:
    name: Database A/B harness (reproducibility gate)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - name: Setup Python 3.15
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.15"

      - name: Run the W6 harness gate
        run: bash scripts/ci-job-steps.sh run db-ab

  # ---------------------------------------------------------------------------
  # Contract suites — the gate that had no CI coverage on either provider
  # ---------------------------------------------------------------------------
  smoke-contracts:
    name: Repo contract suites
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - name: Setup Python 3.15
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.15"

      # Mirrors the CNB "Contract suites" stage: a bare delegation call, no logic
      # of its own. scripts/test_ci_job_contracts.py lives under
      # `smoke.sh --profile contracts`, which no pipeline invoked, so it could not
      # fail a build and a dropped exec bit on a shared script reached main.
      - name: Repo contract suites (scripts/ci-job-steps.sh)
        run: bash scripts/ci-job-steps.sh run smoke-contracts

  # ---------------------------------------------------------------------------
  # Job 3 — Machine dependency evidence and dependency-health gates
  # ---------------------------------------------------------------------------
  dependency-governance:
    name: Dependency graphs + governance
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VITE_DEPLOYMENT_MODE: demo
      VITE_BASE_URL: /
      VITE_API_BASE_URL: https://api.soymutdb.test
      VITE_JBROWSE_BASE_URL: https://jbrowse.soymutdb.test
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - name: Install pnpm 12
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.11.2

      - name: Setup Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26.13.0
          cache: pnpm

      - name: Setup Python 3.15
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.15"

      - name: Use official npm registry
        run: pnpm config set registry https://registry.npmjs.org/

      - name: Install workspace and graph tooling
        run: |
          pnpm install --frozen-lockfile
          python -m pip install --quiet PyYAML==6.0.3 uv==0.13.1

      # Generates the normalized pnpm/uv/Compose/OCI graphs and runs every
      # blocking governance audit. The script always attempts the full audit set
      # so a failed graph cannot hide Knip, Deptry, cycle, duplicate, license or
      # vulnerability evidence; an unavailable analyzer fails closed.
      - name: Dependency graphs and gates (scripts/ci-job-steps.sh)
        if: always()
        env:
          UV_CACHE_DIR: ${{ runner.temp }}/soymutdb-governance-uv-cache
        run: bash scripts/ci-job-steps.sh run dependency-governance

      - name: Upload dependency governance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-governance-${{ github.sha }}
          path: |
            artifacts/dependency-graphs
            artifacts/dependency-audit
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Job 4 — Build, runtime-smoke, scan, and inventory every platform image
  # ---------------------------------------------------------------------------
  # Run only after every non-image hard gate succeeds. This job remains
  # read-only: main pushes are performed by publish-images from the exact
  # platform archives exported after all runtime and vulnerability gates.
  docker-build:
    name: Docker ${{ matrix.arch }} build + runtime + scan
    needs:
      - frontend
      - api-tests
      - dependency-governance
      - clickhouse-migration
      - mcp-e2e
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
            output: validate-runtime-images-amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            output: validate-runtime-images-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      # The whole build/runtime/scan/SBOM/export sequence lives in one script so
      # the CNB pipeline runs exactly the same gates in exactly the same order.
      SOYMUTDB_CI_ARCH: ${{ matrix.arch }}
      SOYMUTDB_CI_OUTPUT_DIR: validate-runtime-images-${{ matrix.arch }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      # Docker-backed Compose acceptance stays on the CI runner. Developer and
      # pre-commit checks use scripts/test_platform_delivery_contracts.py and
      # do not require a local daemon or production secrets.
      - name: Validate production Compose profiles (Docker-only CI gate)
        if: matrix.arch == 'amd64'
        env:
          API_IMAGE_REF: ghcr.io/example/api@sha256:1111111111111111111111111111111111111111111111111111111111111111
          WORKER_IMAGE_REF: ghcr.io/example/worker@sha256:2222222222222222222222222222222222222222222222222222222222222222
          MCP_IMAGE_REF: ghcr.io/example/mcp-server@sha256:3333333333333333333333333333333333333333333333333333333333333333
          JBROWSE_IMAGE_REF: ghcr.io/example/jbrowse@sha256:4444444444444444444444444444444444444444444444444444444444444444
          POSTGRES_PASSWORD: ci-compose-postgres
          CLICKHOUSE_PASSWORD: ci-compose-clickhouse
          REDIS_PASSWORD: ci-compose-redis
          MINIO_ROOT_USER: ci-compose-minio
          MINIO_ROOT_PASSWORD: ci-compose-minio-secret
          SOYMUTDB_MCP_API_TOKEN: ci-compose-mcp-token
          GRAFANA_PASSWORD: ci-compose-grafana
        run: bash scripts/ci-job-steps.sh run compose-acceptance

      # build -> runtime smoke -> architecture proof -> Trivy -> SPDX -> export.
      # CRITICAL/HIGH findings in any release image fail this step; every
      # exception must be triaged in .trivyignore.
      - name: Build, smoke, scan, and export images (scripts/build-release-image.sh)
        run: SOYMUTDB_CI_SKIP_COMPOSE=1 bash scripts/build-release-image.sh

      - name: Upload Trivy SARIF reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trivy-sarif-${{ matrix.arch }}
          path: trivy-*.sarif
          if-no-files-found: ignore

      - name: Upload validated runtime images
        if: >-
          success() &&
          (matrix.arch == 'amd64' ||
          (github.event_name == 'push' && github.ref == 'refs/heads/main'))
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: validated-runtime-images-${{ matrix.arch }}
          path: validate-runtime-images-${{ matrix.arch }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Job 5 — Load the exact verified amd64 package into a real Kind cluster
  # ---------------------------------------------------------------------------
  # This is a Kubernetes runtime smoke for the CI-only amd64 harness. It is
  # deliberately not an arm64 Kubernetes-cluster claim: native arm64 Docker
  # build/smoke/scan evidence remains the multi-platform release evidence.
  kubernetes-kind:
    name: Kubernetes Kind smoke (verified linux/amd64 images)
    needs: docker-build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - name: Setup Python for manifest policy
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.15"

      - name: Validate Kind manifests and policy before cluster mutation
        run: |
          python -m pip install --quiet PyYAML==6.0.3
          python3 scripts/check-kubernetes-manifests.py infra/k8s/kind-smoke

      - name: Download validated amd64 runtime package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: validate-runtime-images-amd64
          path: validate-runtime-images-amd64

      - name: Verify and load validated amd64 runtime package
        run: |
          set -euo pipefail
          artifact_dir=validate-runtime-images-amd64
          test "$(cat "${artifact_dir}/platform.txt")" = "linux/amd64"
          (cd "${artifact_dir}" && sha256sum -c SHA256SUMS)
          gzip -dc "${artifact_dir}/soymutdb-runtime-images-amd64.tar.gz" | docker load
          # The expected image set comes from the shared list, and the package
          # must DESCRIBE exactly that set: a per-image "is it present" loop
          # accepts a package that also carries an image nobody expects.
          # shellcheck source=scripts/list-images.sh
          source scripts/list-images.sh
          expected="$(soymutdb_image_names | sed 's|$|:ci-amd64|')"
          test "$(cat "${artifact_dir}/image-ids-amd64.txt")" = "${expected}"
          for image_name in $(soymutdb_image_names); do
            image="soymutdb-${image_name}:ci-amd64"
            expected_id="$(awk -v image="${image}" '$1 == image {print $2}' "${artifact_dir}/image-ids-amd64.txt")"
            test -n "${expected_id}"
            test "$(docker image inspect --format '{{.Id}}' "${image}")" = "${expected_id}"
            test "$(docker image inspect --format '{{.Architecture}}' "${image}")" = "amd64"
          done

      - name: Create Kind cluster
        uses: helm/kind-action@a1b0e391336a6ee6713a0583f8c6240d70863de3 # v1.12.0
        with:
          version: v0.26.0
          kubectl_version: v1.31.4
          cluster_name: soymutdb-kind-smoke
          wait: 120s

      - name: Load checksum-verified workloads into Kind
        run: >-
          kind load docker-image
          soymutdb-api:ci-amd64
          soymutdb-worker:ci-amd64
          --name soymutdb-kind-smoke

      - name: Render and apply Kind smoke manifests
        run: |
          set -euo pipefail
          kubectl kustomize infra/k8s/kind-smoke > /tmp/soymutdb-kind-smoke.yaml
          kubectl apply --dry-run=client --validate=true -f /tmp/soymutdb-kind-smoke.yaml
          kubectl apply -k infra/k8s/kind-smoke

      - name: Prove deployed API and worker behavior
        run: |
          set -euo pipefail
          namespace=soymutdb-kind-smoke
          kubectl -n "${namespace}" rollout status deployment/api --timeout=180s
          kubectl -n "${namespace}" rollout status deployment/worker --timeout=180s
          test "$(kubectl -n "${namespace}" get deployment/api -o jsonpath='{.spec.template.spec.containers[0].image}')" = "soymutdb-api:ci-amd64"
          test "$(kubectl -n "${namespace}" get deployment/worker -o jsonpath='{.spec.template.spec.containers[0].image}')" = "soymutdb-worker:ci-amd64"
          worker_metrics="$(kubectl -n "${namespace}" exec deployment/worker -- python -c 'import urllib.request; print(urllib.request.urlopen("http://127.0.0.1:9808/metrics", timeout=5).read().decode())')"
          grep -Eq '^soymutdb_worker_up(\{[^}]*\})?[[:space:]]+1(\.0+)?$' <<<"${worker_metrics}"
          kubectl -n "${namespace}" port-forward service/api 18080:80 >/tmp/soymutdb-kind-port-forward.log 2>&1 &
          port_forward_pid=$!
          cleanup() {
            kill "${port_forward_pid}" 2>/dev/null || true
            wait "${port_forward_pid}" 2>/dev/null || true
          }
          trap cleanup EXIT
          for attempt in {1..30}; do
            if curl --fail --silent --show-error --max-time 5 http://127.0.0.1:18080/api/v1/health/live >/tmp/soymutdb-kind-live.json; then
              break
            fi
            sleep 2
          done
          jq -e '.status == "ok"' /tmp/soymutdb-kind-live.json >/dev/null

      - name: Capture Kind diagnostics on failure
        if: failure()
        run: |
          kubectl get pods --all-namespaces -o wide || true
          kubectl -n soymutdb-kind-smoke describe deployment/api || true
          kubectl -n soymutdb-kind-smoke describe deployment/worker || true
          kubectl -n soymutdb-kind-smoke logs deployment/api --all-containers=true || true
          kubectl -n soymutdb-kind-smoke logs deployment/worker --all-containers=true || true
          cat /tmp/soymutdb-kind-port-forward.log || true

  # ---------------------------------------------------------------------------
  # Job 6 — Merge/sign only images exported by both read-only verify jobs
  # ---------------------------------------------------------------------------
  publish-images:
    name: Merge, sign, and publish verified runtime images
    needs: [docker-build, kubernetes-kind]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      release-contract-sha256: ${{ steps.release-contract.outputs.sha256 }}
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      # The contract script is provider-agnostic: it reads its registry
      # namespace and source identity from the environment, so CNB and GitHub
      # publish the same manifest/signature structure.
      RELEASE_REGISTRY: ghcr.io
      RELEASE_REGISTRY_OWNER: ${{ github.repository_owner }}
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_ACTOR: ${{ github.actor }}
      SOURCE_REPOSITORY: ${{ github.repository }}
      SOURCE_REVISION: ${{ github.sha }}
      SOURCE_PIPELINE: ${{ github.run_id }}-${{ github.run_attempt }}
      VALIDATED_ROOT: validated-platforms
      PAGES_ARTIFACT_DIR: pages-dist
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - name: Download validated runtime images
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: validated-runtime-images-*
          path: validated-platforms

      - name: Install Cosign
        uses: sigstore/cosign-installer@3454372f43399081ed03b604cb2d021dabca52bb # v3.8.2
        with:
          cosign-release: v2.4.1

      # Verifies both platform packages (checksums + image IDs), pushes the
      # per-platform images, merges manifests, signs and attests every digest,
      # and writes the checksummed release contract. No rebuild happens here.
      - name: Publish signed multi-architecture release
        id: release-contract
        run: bash scripts/release-contract.golden.sh

      - name: Upload signed OCI release contract
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: oci-release-contract-${{ github.sha }}
          path: release-contract
          if-no-files-found: error
          retention-days: 90

  # ---------------------------------------------------------------------------
  # Job 6 — Real ClickHouse legacy migration (hard gate)
  # ---------------------------------------------------------------------------
  clickhouse-migration:
    name: ClickHouse migration fixture (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: false
    # Preserve the current 24.8 acceptance contract while qualifying 25.8 LTS
    # against the same real fixture and idempotence checks. This does not
    # upgrade existing volumes or production by changing a Docker tag.
    strategy:
      fail-fast: false
      matrix:
        image:
          - clickhouse/clickhouse-server:24.8-alpine
          - clickhouse/clickhouse-server:25.8-alpine
    env:
      SOYMUTDB_CLICKHOUSE_CI_IMAGE: ${{ matrix.image }}
      SOYMUTDB_CLICKHOUSE_PASSWORD: ci-ch-password
      CLICKHOUSE_MIGRATION_PYTHON: python
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
      # Python 3.14 on purpose, and only in this job: it is the CI counterpart
      # of infra/docker/Dockerfile.migrate-clickhouse, which stays on 3.14
      # because clickhouse-connect's newest release (1.10) declares
      # `requires-python >=3.10,<3.15`. The migration library and its
      # assertions need that driver, so the legacy ClickHouse path keeps one
      # interpreter of its own while every native service moved to 3.15.
      # scripts/ci-job-steps.sh asserts the 3.14 major.minor on
      # CLICKHOUSE_MIGRATION_PYTHON before provisioning the driver.
      - name: Setup Python 3.14
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"

      # Real ClickHouse server, legacy fixture, canonical-state assertions and
      # the idempotence re-run — all in one shared script. The script also
      # provisions its Python dependency (clickhouse-connect) so CNB and GitHub
      # install the same thing instead of one inlining it here.
      - name: Migrate the legacy ClickHouse fixture (scripts/ci-job-steps.sh)
        run: bash scripts/ci-job-steps.sh run clickhouse-migration

      - name: Cleanup ClickHouse
        if: always()
        run: docker rm -f soymutdb-ci-clickhouse

  # ---------------------------------------------------------------------------
  # Job 7 — MCP authenticated transport (hard gate)
  # ---------------------------------------------------------------------------
  mcp-e2e:
    name: MCP transport e2e (nginx /mcp)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: false
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      # Builds the MCP image, runs it behind the production nginx semantics, and
      # asserts the auth contract (401 / 308 / 401 / 2xx).
      - name: MCP transport smoke (scripts/ci-job-steps.sh)
        run: bash scripts/ci-job-steps.sh run mcp-e2e
