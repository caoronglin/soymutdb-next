# =============================================================================
# SoyMutDB Next — CI/CD (build & verify pipeline)
#
# Trigger  : push to main + all pull requests
# Jobs     :
#   frontend    — pnpm install, build, bundle budget, unit tests, lint,
#                 typecheck, and OpenAPI contract checks (all hard gates),
#                 then upload dist artifacts for deployment
#   api-tests   — Python 3.14 venv + full pytest tree (hard gate, including A0
#                 and testcontainers integration), Ruff (non-blocking), worker
#                 analysis deps install + import verification (hard gate)
#   dependency-governance— normalized pnpm/uv/Compose/OCI graphs plus blocking
#                 unused/dependency/cycle/version/license/vulnerability audits
#   docker-build— after all other hard gates pass, independently build API /
#                 Worker / MCP / JBrowse on native amd64 and arm64 runners;
#                 smoke, scan, generate SPDX, and export exact image packages
#   publish-images— on main only, load both verified packages, merge exact
#                   platform manifests, keyless-sign/attest them, and publish a
#                   source-bound release manifest without rebuilding
#
# Ruff remains non-blocking until the Python baseline is reduced. Frontend
# build/test/lint/typecheck/contract and the full API pytest tree are blocking.
#
# Actions are pinned to commit SHAs (trailing comments record the tag) and
# Node is pinned to an exact release for reproducibility. The Deploy Web to
# Pages workflow consumes this workflow via workflow_run and only publishes
# after it succeeds on main (see pages.yml).
#
# NOTE: the repo's .npmrc points at npmmirror; CI explicitly overrides the
# registry to https://registry.npmjs.org/ (official) before installing.
# =============================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  # ---------------------------------------------------------------------------
  # Job 1 — Frontend: install, build, contract check, artifacts
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend build + contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - name: Install pnpm 11
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          # Must match package.json "packageManager" exactly.
          version: 11.21.0

      - name: Setup Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.19.0
          # Cache the pnpm store; key is derived from pnpm-lock.yaml.
          cache: pnpm

      # .npmrc at repo root forces npmmirror — override to the official registry.
      - name: Use official npm registry
        run: pnpm config set registry https://registry.npmjs.org/

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build all apps (hard gate)
        env:
          # CI has no published release API.  Use the explicit demo fixture for
          # sample SSG instead of attempting to fetch the placeholder origin.
          # This is the DEMO build path (VITE_DEPLOYMENT_MODE=demo). The PRODUCTION
          # path is a separate, strict build (VITE_DEPLOYMENT_MODE=production) that
          # requires a reachable release API, binds SOYMUTDB_RELEASE_ID, emits
          # manifest.json + SHA256SUMS, and is gated by check-production-artifact.sh
          # with NO --allow-demo. See docs/ops/production-build.md.
          VITE_DEPLOYMENT_MODE: demo
          VITE_API_BASE_URL: https://api.soymutdb.test
          VITE_JBROWSE_BASE_URL: https://jbrowse.soymutdb.test
        run: pnpm build

      # --- Production-artifact placeholder scan (hard gate) -------------------
      # Even the demo artifact must not bake placeholder origins (api.example.com /
      # jbrowse.example.com / change-me) into its deployment-facing HTML. The strict
      # production gate additionally rejects demo fixtures — that gate is not run
      # here because this job builds the DEMO artifact with fixture data, and it is
      # enforced in the release workflow via check-production-artifact.sh (no flag).
      - name: Scan demo artifact for placeholder origins
        run: bash scripts/check-production-artifact.sh apps/web/dist --allow-demo

      # --- G2 bundle budget gate (hard gate) ----------------------------------
      # antd ≤320KB / pro-components ≤180KB / main entry ≤200KB gzip.
      # Thresholds overridable via ANTD_MAX_KB / PRO_MAX_KB / ENTRY_MAX_KB env.
      - name: Bundle size budget check (G2 hard gate)
        run: bash scripts/check-bundle-size.sh

      - name: Workspace JS unit tests (hard gate)
        run: pnpm turbo run test

      # --- blocking quality gates ---------------------------------------------
      - name: Lint (hard gate)
        if: always()
        run: pnpm turbo run lint

      - name: Typecheck (hard gate)
        if: always()
        run: pnpm turbo run typecheck

      # --- OpenAPI contract check -------------------------------------------
      # check-contract.sh exports the backend OpenAPI document using
      # apps/api/.venv/bin/python, so the venv must exist before running it.
      - name: Setup Python 3.14
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"

      - name: Prepare API venv (for OpenAPI export)
        run: |
          python -m venv apps/api/.venv
          apps/api/.venv/bin/pip install --quiet -e packages/jobs-py
          apps/api/.venv/bin/pip install --quiet -e apps/api

      - name: API client contract check (hard gate)
        run: pnpm --filter @soymutdb/api-client check:contract

      # Pages deploys the exact static tree checked here.  It must not rebuild
      # a verified commit later with a different environment or toolchain.
      - name: Build GitHub Pages demo artifact (deploy input)
        env:
          VITE_DEPLOYMENT_MODE: demo
          VITE_BASE_URL: /${{ github.event.repository.name }}/
          VITE_API_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/api/v1
          VITE_CDN_ENABLED: "false"
          VITE_JBROWSE_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/soymutdb-jbrowse/
          VITE_JBROWSE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/soymutdb-jbrowse/
          SOYMUTDB_SITE_URL: https://${{ github.repository_owner }}.github.io
        run: |
          pnpm --filter @soymutdb/web build
          VITE_BASE_URL=/${{ github.event.repository.name }}/soymutdb-jbrowse/ \
            VITE_JBROWSE_DATA_URL=/${{ github.event.repository.name }}/jbrowse-data \
            pnpm --filter @soymutdb/jbrowse build
          rm -rf pages-dist
          mkdir -p pages-dist/soymutdb-jbrowse
          cp -r apps/web/dist/. pages-dist/
          cp -r apps/jbrowse/dist/. pages-dist/soymutdb-jbrowse/
          cp pages-dist/index.html pages-dist/404.html
          touch pages-dist/.nojekyll
          (
            cd pages-dist
            find . -type f ! -name SHA256SUMS -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS
            sha256sum -c SHA256SUMS
          )
          test -f pages-dist/SHA256SUMS

      - name: Upload GitHub Pages demo artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pages-demo-dist
          path: pages-dist
          if-no-files-found: error
          compression-level: 0

      # --- dist artifacts for deployment ------------------------------------
      - name: Upload web dist
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist-web
          path: apps/web/dist
          if-no-files-found: error

      - name: Upload admin dist
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist-admin
          path: apps/admin/dist
          if-no-files-found: error

      - name: Upload jbrowse dist
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist-jbrowse
          path: apps/jbrowse/dist
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Job 2 — API: Python venv + pytest (testcontainers on runner docker)
  # ---------------------------------------------------------------------------
  api-tests:
    name: API tests (pytest + testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - name: Setup Python 3.14
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - name: Install API dependencies (official PyPI)
        run: |
          python -m venv apps/api/.venv
          apps/api/.venv/bin/pip install --upgrade pip
          apps/api/.venv/bin/pip install --quiet -e packages/jobs-py
          apps/api/.venv/bin/pip install -e "apps/api[dev]"

      - name: Ruff (baseline failing — non-blocking)
        continue-on-error: true
        working-directory: apps/api
        run: .venv/bin/ruff check app

      # testcontainers-postgres boots a real postgres:16-alpine container on the
      # runner's docker daemon (ubuntu-latest ships docker). The A0
      # reconciliation suite is included now that its collection baseline is
      # green, so this hard gate covers the full API test tree.
      - name: Pytest (hard gate)
        working-directory: apps/api
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: .venv/bin/python -m pytest tests -q

      # --- worker analysis deps gate -----------------------------------------
      # scanpy/leidenalg/anndata must install on the same Python the API tests
      # use. louvain was dropped (no cp314 wheels, unmaintained). Fails the
      # job if any of the analysis imports break.
      - name: Install worker deps + verify analysis imports (hard gate)
        run: |
          apps/api/.venv/bin/pip install --quiet -e apps/worker
          apps/api/.venv/bin/python -c "import scanpy, anndata, leidenalg, igraph, matplotlib; print('analysis deps OK:', scanpy.__version__)"

      - name: Worker pytest including PostgreSQL integration (hard gate)
        env:
          PYTHONPATH: ${{ github.workspace }}
          SOYMUTDB_RUN_POSTGRES_INTEGRATION: "1"
        run: apps/api/.venv/bin/python -m pytest apps/worker/tests -q

  # ---------------------------------------------------------------------------
  # Job 3 — Machine dependency evidence and dependency-health gates
  # ---------------------------------------------------------------------------
  dependency-governance:
    name: Dependency graphs + governance
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VITE_DEPLOYMENT_MODE: demo
      VITE_BASE_URL: /
      VITE_API_BASE_URL: https://api.soymutdb.test
      VITE_JBROWSE_BASE_URL: https://jbrowse.soymutdb.test
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - name: Install pnpm 11
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.21.0

      - name: Setup Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.19.0
          cache: pnpm

      - name: Setup Python 3.14
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"

      - name: Use official npm registry
        run: pnpm config set registry https://registry.npmjs.org/

      - name: Install workspace and graph tooling
        run: |
          pnpm install --frozen-lockfile
          python -m pip install --quiet PyYAML==6.0.3 uv==0.11.33

      - name: Generate machine dependency graphs
        run: pnpm deps:graphs

      # Always attempt the full audit set so a failed graph does not hide Knip,
      # Deptry, cycle, duplicate, license, or vulnerability evidence.
      - name: Run dependency governance gates
        if: always()
        env:
          UV_CACHE_DIR: ${{ runner.temp }}/soymutdb-governance-uv-cache
        run: pnpm deps:audit

      - name: Upload dependency governance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-governance-${{ github.sha }}
          path: |
            artifacts/dependency-graphs
            artifacts/dependency-audit
          if-no-files-found: error
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Job 4 — Build, runtime-smoke, scan, and inventory every platform image
  # ---------------------------------------------------------------------------
  # Run only after every non-image hard gate succeeds. This job remains
  # read-only: main pushes are performed by publish-images from the exact
  # platform archives exported after all runtime and vulnerability gates.
  docker-build:
    name: Docker ${{ matrix.arch }} build + runtime + scan
    needs:
      - frontend
      - api-tests
      - dependency-governance
      - clickhouse-migration
      - mcp-e2e
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - name: Verify Python dependency locks
        run: bash scripts/check-supply-chain.sh

      # Regression guard: every COPY source must exist in the build context
      # (e.g. .npmrc was gitignored and broke the jbrowse image build).
      - name: Verify Dockerfile COPY sources exist (hard gate)
        run: bash scripts/check-dockerfile-copy.sh

      # Docker-backed Compose acceptance stays on the CI runner. Developer and
      # pre-commit checks use scripts/test_platform_delivery_contracts.py and
      # do not require a local daemon or production secrets.
      - name: Validate production Compose profiles (Docker-only CI gate)
        if: matrix.arch == 'amd64'
        env:
          API_IMAGE_REF: ghcr.io/example/api@sha256:1111111111111111111111111111111111111111111111111111111111111111
          WORKER_IMAGE_REF: ghcr.io/example/worker@sha256:2222222222222222222222222222222222222222222222222222222222222222
          MCP_IMAGE_REF: ghcr.io/example/mcp-server@sha256:3333333333333333333333333333333333333333333333333333333333333333
          JBROWSE_IMAGE_REF: ghcr.io/example/jbrowse@sha256:4444444444444444444444444444444444444444444444444444444444444444
          POSTGRES_PASSWORD: ci-compose-postgres
          CLICKHOUSE_PASSWORD: ci-compose-clickhouse
          REDIS_PASSWORD: ci-compose-redis
          MINIO_ROOT_USER: ci-compose-minio
          MINIO_ROOT_PASSWORD: ci-compose-minio-secret
          SOYMUTDB_MCP_API_TOKEN: ci-compose-mcp-token
          GRAFANA_PASSWORD: ci-compose-grafana
        run: |
          profile_sets=(
            "core"
            "core,jbrowse"
            "core,blast"
            "core,analyses"
            "core,mcp"
            "core,cloudflare-tunnel"
          )
          for profile_set in "${profile_sets[@]}"; do
            COMPOSE_PROFILES="$profile_set" docker compose -f docker-compose.yml config --quiet
          done

      - name: Build API image (hard gate)
        run: docker build -f infra/docker/Dockerfile.api -t soymutdb-api:ci-${{ matrix.arch }} .

      - name: Build Worker image (hard gate)
        run: docker build -f infra/docker/Dockerfile.worker -t soymutdb-worker:ci-${{ matrix.arch }} .

      - name: Build MCP image (hard gate)
        run: docker build -f apps/mcp-server/Dockerfile -t soymutdb-mcp:ci-${{ matrix.arch }} apps/mcp-server

      # NOTE: the jbrowse Dockerfile copies the repo .npmrc into the build
      # context, so its internal pnpm install uses npmmirror (existing repo
      # behavior, not changed here). Image build is self-contained.
      - name: Build JBrowse image (hard gate)
        run: docker build -f apps/jbrowse/Dockerfile -t soymutdb-jbrowse:ci-${{ matrix.arch }} .

      - name: Smoke test API runtime image (hard gate)
        run: >-
          docker run --rm
          -e SOYMUTDB_DATABASE_URL=postgresql+asyncpg://ci:ci@database.invalid/soymutdb
          -e SOYMUTDB_REDIS_URL=redis://cache.invalid:6379/0
          -e SOYMUTDB_S3_ENDPOINT=http://storage.invalid:9000
          -e SOYMUTDB_S3_ACCESS_KEY=ci-runtime-access
          -e SOYMUTDB_S3_SECRET_KEY=ci-runtime-secret
          -e SOYMUTDB_JWT_SECRET=ci-runtime-smoke-jwt-secret-0123456789abcdef
          -e SOYMUTDB_CORS_ORIGINS=https://runtime-smoke.invalid
          soymutdb-api:ci-${{ matrix.arch }}
          python -c "import soymutdb_jobs; from app.main import app; assert app.title == 'SoyMutDB'; print('API app import OK')"

      - name: Smoke test Worker task registry (hard gate)
        run: >-
          docker run --rm
          --volume "${GITHUB_WORKSPACE}/scripts/check-worker-task-registry.py:/tmp/check-worker-task-registry.py:ro"
          soymutdb-worker:ci-${{ matrix.arch }}
          python /tmp/check-worker-task-registry.py

      - name: Smoke test MCP runtime image (hard gate)
        run: >-
          docker run --rm
          -e SOYMUTDB_MCP_API_TOKEN=ci-runtime-smoke-token
          soymutdb-mcp:ci-${{ matrix.arch }}
          python -c "from mcp_server.server import mcp; assert mcp is not None; print('MCP server import OK')"

      - name: Smoke test JBrowse runtime image (hard gate)
        run: >-
          docker run --rm soymutdb-jbrowse:ci-${{ matrix.arch }}
          sh -ec 'nginx -t && test -s /usr/share/nginx/html/index.html'

      # Matrix metadata alone is not platform evidence. Fail before scans or
      # export if Docker reports an image architecture different from the
      # independently selected native runner architecture.
      - name: Assert actual native image architecture (hard gate)
        run: |
          set -euo pipefail
          expected_architecture="${{ matrix.arch }}"
          images=(
            "soymutdb-api:ci-${{ matrix.arch }}"
            "soymutdb-worker:ci-${{ matrix.arch }}"
            "soymutdb-mcp:ci-${{ matrix.arch }}"
            "soymutdb-jbrowse:ci-${{ matrix.arch }}"
          )
          for image in "${images[@]}"; do
            actual_architecture="$(docker image inspect --format '{{.Architecture}}' "${image}")"
            test "${actual_architecture}" = "${expected_architecture}"
            echo "verified ${image}: ${actual_architecture}"
          done

      # --- security scan (hard gate) -----------------------------------------
      # CRITICAL/HIGH vulnerabilities in any release image fail the workflow.
      # Any exception must be explicitly triaged in .trivyignore.
      - name: Trivy scan API image (hard gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: soymutdb-api:ci-${{ matrix.arch }}
          format: sarif
          output: trivy-api.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          exit-code: 1

      - name: Trivy scan Worker image (hard gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: soymutdb-worker:ci-${{ matrix.arch }}
          format: sarif
          output: trivy-worker.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          exit-code: 1

      - name: Trivy scan MCP image (hard gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: soymutdb-mcp:ci-${{ matrix.arch }}
          format: sarif
          output: trivy-mcp.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          exit-code: 1

      - name: Trivy scan JBrowse image (hard gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: soymutdb-jbrowse:ci-${{ matrix.arch }}
          format: sarif
          output: trivy-jbrowse.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          exit-code: 1

      # SPDX documents are generated from the same local image IDs that passed
      # runtime smoke and the blocking vulnerability gates above.
      - name: Prepare platform evidence directory
        run: mkdir -p validated-runtime-images

      - name: Generate API SPDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: soymutdb-api:ci-${{ matrix.arch }}
          format: spdx-json
          output: validated-runtime-images/sbom-api-${{ matrix.arch }}.spdx.json
          exit-code: 0

      - name: Generate Worker SPDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: soymutdb-worker:ci-${{ matrix.arch }}
          format: spdx-json
          output: validated-runtime-images/sbom-worker-${{ matrix.arch }}.spdx.json
          exit-code: 0

      - name: Generate MCP SPDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: soymutdb-mcp:ci-${{ matrix.arch }}
          format: spdx-json
          output: validated-runtime-images/sbom-mcp-${{ matrix.arch }}.spdx.json
          exit-code: 0

      - name: Generate JBrowse SPDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: soymutdb-jbrowse:ci-${{ matrix.arch }}
          format: spdx-json
          output: validated-runtime-images/sbom-jbrowse-${{ matrix.arch }}.spdx.json
          exit-code: 0

      - name: Upload Trivy SARIF reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trivy-sarif-${{ matrix.arch }}
          path: trivy-*.sarif
          if-no-files-found: ignore

      - name: Export validated runtime images
        # The amd64 archive is also consumed by the separate Kind smoke job on
        # pull requests.  The arm64 archive remains release-only because Kind
        # runs on an amd64 runner; native arm64 Docker validation still runs.
        if: >-
          success() &&
          (matrix.arch == 'amd64' ||
          (github.event_name == 'push' && github.ref == 'refs/heads/main'))
        run: |
          mkdir -p validated-runtime-images
          validated_images=(
            "soymutdb-api:ci-${{ matrix.arch }}"
            "soymutdb-worker:ci-${{ matrix.arch }}"
            "soymutdb-mcp:ci-${{ matrix.arch }}"
            "soymutdb-jbrowse:ci-${{ matrix.arch }}"
          )
          for image in "${validated_images[@]}"; do
            image_id="$(docker image inspect --format '{{.Id}}' "$image")"
            printf '%s %s\n' "$image" "$image_id"
          done > validated-runtime-images/image-ids-${{ matrix.arch }}.txt
          printf '%s\n' '${{ matrix.platform }}' > validated-runtime-images/platform.txt
          docker save --output validated-runtime-images/soymutdb-runtime-images-${{ matrix.arch }}.tar \
            "${validated_images[@]}"
          cd validated-runtime-images
          sha256sum soymutdb-runtime-images-${{ matrix.arch }}.tar \
            image-ids-${{ matrix.arch }}.txt platform.txt \
            sbom-*-${{ matrix.arch }}.spdx.json > SHA256SUMS

      - name: Upload validated runtime images
        if: >-
          success() &&
          (matrix.arch == 'amd64' ||
          (github.event_name == 'push' && github.ref == 'refs/heads/main'))
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: validated-runtime-images-${{ matrix.arch }}
          path: validated-runtime-images
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Job 5 — Load the exact verified amd64 package into a real Kind cluster
  # ---------------------------------------------------------------------------
  # This is a Kubernetes runtime smoke for the CI-only amd64 harness. It is
  # deliberately not an arm64 Kubernetes-cluster claim: native arm64 Docker
  # build/smoke/scan evidence remains the multi-platform release evidence.
  kubernetes-kind:
    name: Kubernetes Kind smoke (verified linux/amd64 images)
    needs: docker-build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - name: Setup Python for manifest policy
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"

      - name: Validate Kind manifests and policy before cluster mutation
        run: |
          python -m pip install --quiet PyYAML==6.0.3
          python3 scripts/check-kubernetes-manifests.py infra/k8s/kind-smoke

      - name: Download validated amd64 runtime package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: validated-runtime-images-amd64
          path: validated-runtime-images-amd64

      - name: Verify and load validated amd64 runtime package
        run: |
          set -euo pipefail
          artifact_dir=validated-runtime-images-amd64
          test "$(cat "${artifact_dir}/platform.txt")" = "linux/amd64"
          (cd "${artifact_dir}" && sha256sum -c SHA256SUMS)
          docker load --input "${artifact_dir}/soymutdb-runtime-images-amd64.tar"
          for image_name in api worker mcp jbrowse; do
            image="soymutdb-${image_name}:ci-amd64"
            expected_id="$(awk -v image="${image}" '$1 == image {print $2}' "${artifact_dir}/image-ids-amd64.txt")"
            test -n "${expected_id}"
            test "$(docker image inspect --format '{{.Id}}' "${image}")" = "${expected_id}"
            test "$(docker image inspect --format '{{.Architecture}}' "${image}")" = "amd64"
          done

      - name: Create Kind cluster
        uses: helm/kind-action@a1b0e391336a6ee6713a0583f8c6240d70863de3 # v1.12.0
        with:
          version: v0.26.0
          kubectl_version: v1.31.4
          cluster_name: soymutdb-kind-smoke
          wait: 120s

      - name: Load checksum-verified workloads into Kind
        run: >-
          kind load docker-image
          soymutdb-api:ci-amd64
          soymutdb-worker:ci-amd64
          --name soymutdb-kind-smoke

      - name: Render and apply Kind smoke manifests
        run: |
          set -euo pipefail
          kubectl kustomize infra/k8s/kind-smoke > /tmp/soymutdb-kind-smoke.yaml
          kubectl apply --dry-run=client --validate=true -f /tmp/soymutdb-kind-smoke.yaml
          kubectl apply -k infra/k8s/kind-smoke

      - name: Prove deployed API and worker behavior
        run: |
          set -euo pipefail
          namespace=soymutdb-kind-smoke
          kubectl -n "${namespace}" rollout status deployment/api --timeout=180s
          kubectl -n "${namespace}" rollout status deployment/worker --timeout=180s
          test "$(kubectl -n "${namespace}" get deployment/api -o jsonpath='{.spec.template.spec.containers[0].image}')" = "soymutdb-api:ci-amd64"
          test "$(kubectl -n "${namespace}" get deployment/worker -o jsonpath='{.spec.template.spec.containers[0].image}')" = "soymutdb-worker:ci-amd64"
          worker_metrics="$(kubectl -n "${namespace}" exec deployment/worker -- curl --fail --silent --show-error http://127.0.0.1:9808/metrics)"
          grep -Eq '^soymutdb_worker_up[[:space:]]+1(\.0+)?$' <<<"${worker_metrics}"
          kubectl -n "${namespace}" port-forward service/api 18080:80 >/tmp/soymutdb-kind-port-forward.log 2>&1 &
          port_forward_pid=$!
          cleanup() {
            kill "${port_forward_pid}" 2>/dev/null || true
            wait "${port_forward_pid}" 2>/dev/null || true
          }
          trap cleanup EXIT
          for attempt in {1..30}; do
            if curl --fail --silent --show-error --max-time 5 http://127.0.0.1:18080/api/v1/health/live >/tmp/soymutdb-kind-live.json; then
              break
            fi
            sleep 2
          done
          jq -e '.status == "ok"' /tmp/soymutdb-kind-live.json >/dev/null

      - name: Capture Kind diagnostics on failure
        if: failure()
        run: |
          kubectl get pods --all-namespaces -o wide || true
          kubectl -n soymutdb-kind-smoke describe deployment/api || true
          kubectl -n soymutdb-kind-smoke describe deployment/worker || true
          kubectl -n soymutdb-kind-smoke logs deployment/api --all-containers=true || true
          kubectl -n soymutdb-kind-smoke logs deployment/worker --all-containers=true || true
          cat /tmp/soymutdb-kind-port-forward.log || true

  # ---------------------------------------------------------------------------
  # Job 6 — Merge/sign only images exported by both read-only verify jobs
  # ---------------------------------------------------------------------------
  publish-images:
    name: Merge, sign, and publish verified runtime images
    needs: [docker-build, kubernetes-kind]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      release-contract-sha256: ${{ steps.release-contract.outputs.sha256 }}
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Download validated runtime images
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: validated-runtime-images-*
          path: validated-platforms

      - name: Verify and load both platform packages
        run: |
          platform_artifacts=(
            "validated-runtime-images-amd64"
            "validated-runtime-images-arm64"
          )
          for artifact in "${platform_artifacts[@]}"; do
            arch="${artifact##*-}"
            artifact_dir="validated-platforms/${artifact}"
            test "$(cat "${artifact_dir}/platform.txt")" = "linux/${arch}"
            (cd "${artifact_dir}" && sha256sum -c SHA256SUMS)
            docker load --input "${artifact_dir}/soymutdb-runtime-images-${arch}.tar"
            expected_images=(api worker mcp jbrowse)
            test "$(wc -l < "${artifact_dir}/image-ids-${arch}.txt")" -eq "${#expected_images[@]}"
            for image_name in "${expected_images[@]}"; do
              image="soymutdb-${image_name}:ci-${arch}"
              expected_id="$(awk -v image="$image" '$1 == image {print $2}' "${artifact_dir}/image-ids-${arch}.txt")"
              test -n "$expected_id"
              actual_id="$(docker image inspect --format '{{.Id}}' "$image")"
              test "$actual_id" = "$expected_id"
            done
          done

      - name: Compute release tag
        id: image-tags
        run: |
          tag="$(date -u +%Y.%m.%d)-${GITHUB_SHA::7}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@3454372f43399081ed03b604cb2d021dabca52bb # v3.8.2
        with:
          cosign-release: v2.4.1

      - name: Tag and push validated platform images
        env:
          RELEASE_TAG: ${{ steps.image-tags.outputs.tag }}
        run: |
          registry_owner="${GITHUB_REPOSITORY_OWNER,,}"
          local_names=(api worker mcp jbrowse)
          remote_names=(api worker mcp-server jbrowse)
          for arch in amd64 arm64; do
            for index in "${!local_names[@]}"; do
              image="ghcr.io/${registry_owner}/${remote_names[$index]}:${RELEASE_TAG}-${arch}"
              docker tag "soymutdb-${local_names[$index]}:ci-${arch}" "$image"
              docker push "$image"
            done
          done

      - name: Merge manifests, attest evidence, and write release manifest
        id: release-contract
        env:
          RELEASE_TAG: ${{ steps.image-tags.outputs.tag }}
        run: |
          set -euo pipefail
          registry_owner="${GITHUB_REPOSITORY_OWNER,,}"
          mkdir -p release-contract
          certificate_identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/ci.yml@refs/heads/main"
          oidc_issuer="https://token.actions.githubusercontent.com"
          local_names=(api worker mcp jbrowse)
          remote_names=(api worker mcp-server jbrowse)

          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg revision "$GITHUB_SHA" \
            --arg workflow_identity "$certificate_identity" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg release_tag "$RELEASE_TAG" \
            '{
              "schema_version": 1,
              "source": {
                "repository": $repository,
                "revision": $revision,
                "workflow_identity": $workflow_identity,
                "run_id": $run_id
              },
              "release_tag": $release_tag,
              "platforms": ["linux/amd64", "linux/arm64"],
              "images": []
            }' > release-contract/release-manifest.json

          for index in "${!local_names[@]}"; do
            image_name="${local_names[$index]}"
            remote_name="${remote_names[$index]}"
            final_tag="ghcr.io/${registry_owner}/${remote_name}:${RELEASE_TAG}"
            amd64_tag="${final_tag}-amd64"
            arm64_tag="${final_tag}-arm64"

            docker manifest create "$final_tag" "$amd64_tag" "$arm64_tag"
            digest="$(docker manifest push "$final_tag" | tail -n 1)"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            image="$final_tag"
            digest_ref="${image%:*}@${digest}"
            docker manifest inspect "$digest_ref" >/dev/null

            platforms="$(docker manifest inspect "$digest_ref" | jq -r '[.manifests[].platform | "\(.os)/\(.architecture)"] | sort | join(",")')"
            test "$platforms" = "linux/amd64,linux/arm64"
            echo "Verify merged manifest platforms: ${image_name}=${platforms}"

            provenance="release-contract/provenance-${image_name}.json"
            jq -n \
              --arg repository "$GITHUB_REPOSITORY" \
              --arg revision "$GITHUB_SHA" \
              --arg image "$image_name" \
              --arg builder "$certificate_identity" \
              --arg invocation "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
              '{
                "buildDefinition": {
                  "buildType": "https://github.com/soymutdb/oci-multiarch@v1",
                  "externalParameters": {
                    "source_repository": $repository,
                    "source_revision": $revision,
                    "image": $image,
                    "platforms": ["linux/amd64", "linux/arm64"]
                  },
                  "internalParameters": {},
                  "resolvedDependencies": [{
                    "uri": ("git+https://github.com/" + $repository),
                    "digest": {"gitCommit": $revision}
                  }]
                },
                "runDetails": {
                  "builder": {"id": $builder},
                  "metadata": {"invocationId": $invocation}
                }
              }' > "$provenance"
            provenance_sha256="$(sha256sum "$provenance" | cut -d ' ' -f 1)"

            cosign sign --yes "$digest_ref"
            cosign attest --yes --type slsaprovenance --predicate "$provenance" "$digest_ref"
            cosign verify \
              --certificate-identity "$certificate_identity" \
              --certificate-oidc-issuer "$oidc_issuer" "$digest_ref" >/dev/null
            cosign verify-attestation --type slsaprovenance \
              --certificate-identity "$certificate_identity" \
              --certificate-oidc-issuer "$oidc_issuer" "$digest_ref" >/dev/null

            platforms_json='[]'
            for arch in amd64 arm64; do
              platform_tag="${final_tag}-${arch}"
              platform_digest="$(docker manifest inspect --verbose "$platform_tag" | jq -r '.Descriptor.digest')"
              [[ "$platform_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
              platform_ref="${platform_tag%:*}@${platform_digest}"
              sbom_source="validated-platforms/validated-runtime-images-${arch}/sbom-${image_name}-${arch}.spdx.json"
              sbom_target="release-contract/sbom-${image_name}-${arch}.spdx.json"
              cp "$sbom_source" "$sbom_target"
              jq -e '.spdxVersion | startswith("SPDX-")' "$sbom_target" >/dev/null
              sbom_sha256="$(sha256sum "$sbom_target" | cut -d ' ' -f 1)"

              cosign sign --yes "$platform_ref"
              cosign attest --yes --type spdxjson --predicate "$sbom_target" "$platform_ref"
              cosign verify \
                --certificate-identity "$certificate_identity" \
                --certificate-oidc-issuer "$oidc_issuer" "$platform_ref" >/dev/null
              cosign verify-attestation --type spdxjson \
                --certificate-identity "$certificate_identity" \
                --certificate-oidc-issuer "$oidc_issuer" "$platform_ref" >/dev/null

              platform_entry="$(jq -n \
                --arg platform "linux/${arch}" \
                --arg digest_ref "$platform_ref" \
                --arg sbom "$(basename "$sbom_target")" \
                --arg sbom_sha256 "$sbom_sha256" \
                '{platform: $platform, digest_ref: $digest_ref, sbom: $sbom, sbom_sha256: $sbom_sha256}')"
              platforms_json="$(jq --argjson item "$platform_entry" '. + [$item]' <<<"$platforms_json")"
            done

            image_entry="$(jq -n \
              --arg name "$image_name" \
              --arg digest_ref "$digest_ref" \
              --arg provenance "$(basename "$provenance")" \
              --arg provenance_sha256 "$provenance_sha256" \
              --argjson platforms "$platforms_json" \
              '{
                name: $name,
                digest_ref: $digest_ref,
                provenance: $provenance,
                provenance_sha256: $provenance_sha256,
                platforms: $platforms
              }')"
            jq --argjson image "$image_entry" '.images += [$image]' \
              release-contract/release-manifest.json > release-contract/release-manifest.tmp
            mv release-contract/release-manifest.tmp release-contract/release-manifest.json
          done

          expected_provenance=(
            "release-contract/provenance-api.json"
            "release-contract/provenance-worker.json"
            "release-contract/provenance-mcp.json"
            "release-contract/provenance-jbrowse.json"
          )
          for provenance_file in "${expected_provenance[@]}"; do
            test -s "$provenance_file"
          done
          jq -r '.images[].digest_ref' release-contract/release-manifest.json | sort > release-contract/oci-image-refs.txt

          cd release-contract
          jq -e '
            .schema_version == 1 and
            .platforms == ["linux/amd64", "linux/arm64"] and
            (.images | length == 4) and
            ([.images[].name] | sort) == ["api", "jbrowse", "mcp", "worker"] and
            all(.images[];
              (.digest_ref | test("@sha256:[0-9a-f]{64}$")) and
              (.provenance_sha256 | test("^[0-9a-f]{64}$")) and
              ([.platforms[].platform] | sort) == ["linux/amd64", "linux/arm64"]
            )
          ' release-manifest.json >/dev/null
          sha256sum oci-image-refs.txt > OCI_SHA256SUMS
          sha256sum release-manifest.json oci-image-refs.txt provenance-*.json sbom-*.spdx.json > SHA256SUMS
          cosign sign-blob --yes --bundle release-manifest.sigstore.json release-manifest.json
          cosign verify-blob \
            --bundle release-manifest.sigstore.json \
            --certificate-identity "$certificate_identity" \
            --certificate-oidc-issuer "$oidc_issuer" release-manifest.json
          contract_sha="$(sha256sum release-manifest.json | cut -d ' ' -f 1)"
          echo "sha256=$contract_sha" >> "$GITHUB_OUTPUT"
          {
            echo "## Signed multi-architecture OCI release contract"
            echo
            echo '```text'
            cat oci-image-refs.txt
            echo '```'
            echo
            echo "Contract SHA-256: \`$contract_sha\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload signed OCI release contract
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: oci-release-contract-${{ github.sha }}
          path: release-contract
          if-no-files-found: error
          retention-days: 90

  # ---------------------------------------------------------------------------
  # Job 6 — Real ClickHouse legacy migration (hard gate)
  # ---------------------------------------------------------------------------
  clickhouse-migration:
    name: ClickHouse migration fixture
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: false
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - name: Setup Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install ClickHouse client
        run: python -m pip install --quiet clickhouse-connect

      - name: Start ClickHouse
        run: |
          docker run -d --name ch-test -p 8123:8123 \
            -e CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1 \
            -e CLICKHOUSE_PASSWORD=ci-ch-password \
            clickhouse/clickhouse-server:24.8-alpine
          for attempt in {1..60}; do
            if curl --fail --silent -u default:ci-ch-password http://127.0.0.1:8123/ping; then
              exit 0
            fi
            sleep 2
          done
          docker logs ch-test
          exit 1

      - name: Load legacy fixture
        env:
          SOYMUTDB_CLICKHOUSE_HOST: 127.0.0.1
          SOYMUTDB_CLICKHOUSE_PORT: "8123"
          SOYMUTDB_CLICKHOUSE_USER: default
          SOYMUTDB_CLICKHOUSE_PASSWORD: ci-ch-password
          SOYMUTDB_CLICKHOUSE_DATABASE: soymutdb
        run: bash deploy/scripts/migrate-ch-fixture.sh

      - name: Run migration and assert canonical state
        env:
          SOYMUTDB_CLICKHOUSE_HOST: 127.0.0.1
          SOYMUTDB_CLICKHOUSE_PORT: "8123"
          SOYMUTDB_CLICKHOUSE_USER: default
          SOYMUTDB_CLICKHOUSE_PASSWORD: ci-ch-password
          SOYMUTDB_CLICKHOUSE_DATABASE: soymutdb
          CLICKHOUSE_MIGRATION_PYTHON: python
        run: |
          bash deploy/scripts/migrate-clickhouse.sh
          python - <<'PY'
          import clickhouse_connect
          c = clickhouse_connect.get_client(host="127.0.0.1", port=8123,
                                            username="default", password="ci-ch-password",
                                            database="soymutdb")
          assert c.query("SELECT count() FROM variant_facts").result_rows[0][0] == 3
          assert c.query("SELECT countIf(release_key != '') FROM variant_facts").result_rows[0][0] == 3
          summaries = ["gene_impact_summary", "chromosome_summary", "mutant_line_summary",
                       "release_dashboard", "density_10kb", "density_100kb", "density_1mb",
                       "substitution_spectrum"]
          materialized_views = ["mv_gene_impact", "mv_chromosome_summary", "mv_mutant_line_summary", "mv_release_dashboard", "mv_density_10kb", "mv_density_100kb", "mv_density_1mb", "mv_substitution_spectrum"]
          objects = {name: engine for name, engine in c.query("SELECT name, engine FROM system.tables WHERE database = currentDatabase()").result_rows}
          assert len(set(summaries) & objects.keys()) == len(summaries), objects
          assert len(set(materialized_views) & objects.keys()) == len(materialized_views), objects
          for name in summaries:
              assert objects[name] != "MaterializedView", (name, objects[name])
          for name in materialized_views:
              assert objects[name] == "MaterializedView", (name, objects[name])
          print("ClickHouse migration assertions passed")
          PY

      - name: Re-run migration and assert idempotence
        env:
          SOYMUTDB_CLICKHOUSE_HOST: 127.0.0.1
          SOYMUTDB_CLICKHOUSE_PORT: "8123"
          SOYMUTDB_CLICKHOUSE_USER: default
          SOYMUTDB_CLICKHOUSE_PASSWORD: ci-ch-password
          SOYMUTDB_CLICKHOUSE_DATABASE: soymutdb
          CLICKHOUSE_MIGRATION_PYTHON: python
        run: |
          before=$(python -c 'import clickhouse_connect; c=clickhouse_connect.get_client(host="127.0.0.1",port=8123,username="default",password="ci-ch-password",database="soymutdb"); print(c.query("SELECT count() FROM variant_facts").result_rows[0][0])')
          before_summary=$(python -c 'import clickhouse_connect; c=clickhouse_connect.get_client(host="127.0.0.1",port=8123,username="default",password="ci-ch-password",database="soymutdb"); print(c.query("SELECT sum(x) FROM (SELECT count() AS x FROM gene_impact_summary UNION ALL SELECT count() FROM chromosome_summary UNION ALL SELECT count() FROM mutant_line_summary UNION ALL SELECT count() FROM release_dashboard UNION ALL SELECT count() FROM density_10kb UNION ALL SELECT count() FROM density_100kb UNION ALL SELECT count() FROM density_1mb UNION ALL SELECT count() FROM substitution_spectrum)").result_rows[0][0])')
          bash deploy/scripts/migrate-clickhouse.sh
          after=$(python -c 'import clickhouse_connect; c=clickhouse_connect.get_client(host="127.0.0.1",port=8123,username="default",password="ci-ch-password",database="soymutdb"); print(c.query("SELECT count() FROM variant_facts").result_rows[0][0])')
          after_summary=$(python -c 'import clickhouse_connect; c=clickhouse_connect.get_client(host="127.0.0.1",port=8123,username="default",password="ci-ch-password",database="soymutdb"); print(c.query("SELECT sum(x) FROM (SELECT count() AS x FROM gene_impact_summary UNION ALL SELECT count() FROM chromosome_summary UNION ALL SELECT count() FROM mutant_line_summary UNION ALL SELECT count() FROM release_dashboard UNION ALL SELECT count() FROM density_10kb UNION ALL SELECT count() FROM density_100kb UNION ALL SELECT count() FROM density_1mb UNION ALL SELECT count() FROM substitution_spectrum)").result_rows[0][0])')
          test "$before" = "$after" && test "$before_summary" = "$after_summary"

      - name: Cleanup ClickHouse
        if: always()
        run: docker rm -f ch-test

  # ---------------------------------------------------------------------------
  # Job 7 — MCP authenticated transport (hard gate)
  # ---------------------------------------------------------------------------
  mcp-e2e:
    name: MCP transport e2e (nginx /mcp)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: false
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build MCP image
        run: docker build -t soymutdb-mcp:ci apps/mcp-server
      - name: Create e2e network
        run: docker network create mcp-e2e
      - name: Start MCP server
        run: docker run -d --network mcp-e2e --name mcp-server -e SOYMUTDB_MCP_API_TOKEN=ci-test-token soymutdb-mcp:ci
      - name: Start nginx reverse proxy (/mcp -> mcp-server)
        run: |
          cat > /tmp/mcp-nginx.conf <<'NGINX'
          worker_processes 1;
          events {}
          http {
            resolver 127.0.0.11 valid=30s ipv6=off;
            limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/s;
            server {
              listen 80;
              location = /mcp/ {
                if ($http_authorization = "") { return 401; }
                return 308 /mcp;
              }
              location = /mcp {
                if ($http_authorization = "") { return 401; }
                limit_req zone=auth burst=10 nodelay;
                set $mcp_upstream http://mcp-server:9000;
                proxy_pass $mcp_upstream;
                proxy_http_version 1.1;
                proxy_set_header Connection "";
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_set_header X-Request-ID $request_id;
                proxy_buffering off;
                proxy_cache off;
                proxy_read_timeout 600s;
                proxy_send_timeout 600s;
                proxy_connect_timeout 10s;
              }
            }
          }
          NGINX
          docker run -d --network mcp-e2e --name mcp-nginx -p 127.0.0.1:8081:80 -v /tmp/mcp-nginx.conf:/etc/nginx/nginx.conf:ro nginx:1.27-alpine
      - name: Assert MCP authentication through nginx
        run: |
          payload='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}'
          # FastMCP's canonical Streamable HTTP endpoint is /mcp.
          base=http://127.0.0.1:8081/mcp
          code=000
          for attempt in {1..60}; do
            code=$(curl --silent --output /dev/null --write-out '%{http_code}' -X POST "$base" -H 'Content-Type: application/json' -d "$payload" || true)
            test "$code" = 401 && break
            sleep 2
          done
          test "$code" = 401
          slash_base=http://127.0.0.1:8081/mcp/
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' -X POST "$slash_base" -H 'Content-Type: application/json' -d "$payload")" = 401
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' -X POST "$slash_base" -H 'Content-Type: application/json' -H 'Authorization: Bearer ci-test-token' -d "$payload")" = 308
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' -X POST "$base" -H 'Content-Type: application/json' -H 'Authorization: Bearer wrong' -d "$payload")" = 401
          code=000
          for attempt in {1..60}; do
            code=$(curl --silent --output /dev/null --write-out '%{http_code}' -X POST "$base" -H 'Accept: application/json, text/event-stream' -H 'Content-Type: application/json' -H 'Authorization: Bearer ci-test-token' -d "$payload" || true)
            test "$code" -ge 200 -a "$code" -lt 300 && break
            sleep 2
          done
          test "$code" -ge 200 -a "$code" -lt 300
      - name: Cleanup MCP
        if: always()
        run: |
          docker rm -f mcp-nginx || true
          docker rm -f mcp-server || true
          docker network rm mcp-e2e || true
