# =============================================================================
# SoyMutDB Next — Deploy public demo to GitHub Pages (gh-pages branch)
#
# Trigger: the "CI" workflow completing successfully on main (workflow_run),
# plus manual dispatch. A failed or cancelled CI run never reaches the deploy
# job: the gate job hard-fails unless the triggering run concluded successfully
# on a main-branch commit of this repository. The deploy job then checks out
# that exact commit (workflow_run.head_sha), consumes CI's static artifact,
# and force-pushes those verified bytes to gh-pages.
#
# No API/worker is deployed; API requests use the same-origin /api/v1 demo URL
# and render existing unavailable/empty states on GitHub Pages.
# =============================================================================
name: Deploy Web to Pages

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      publication_id:
        description: "Immutable static publication id (Phase 3)."
        required: true
        default: ""
      artifact_url:
        description: "URL of the immutable artifact to download + verify."
        required: true
        default: ""
      manifest_digest:
        description: "SHA-256 of the artifact's manifest.json (digest verification)."
        required: true
        default: ""

permissions:
  actions: read
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  gate:
    name: Gate on successful CI for main
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # workflow_run consumers fire for every CI completion (PRs included).
      # Only a successful CI run on a main-branch commit of this repository
      # may deploy; anything else fails here so the deploy job is skipped.
      # Manual dispatch bypasses the gate deliberately (operator-run release).
      - name: Require CI success on the same main commit
        if: github.event_name == 'workflow_run'
        env:
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
        run: |
          if [ "$HEAD_BRANCH" != "main" ] || [ "$HEAD_REPO" != "${{ github.repository }}" ]; then
            echo "Non-main or foreign-repository CI run — nothing to deploy."
            exit 0
          fi
          test "$CONCLUSION" = "success"

  deploy:
    name: Publish CI-verified Pages tree (gh-pages) branch
    needs: gate
    # Authoritative guard: only manual dispatch or a successful CI run on a
    # main-branch commit of this repository may publish.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Deploy the exact commit the triggering CI run verified (head_sha);
      # fall back to the dispatch ref for manual runs.
      - name: Checkout CI-verified commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Download CI-verified Pages artifact
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          rm -rf /tmp/pages-dist
          gh run download "$CI_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name pages-demo-dist --dir /tmp/pages-dist
          test -f /tmp/pages-dist/SHA256SUMS

      - name: Verify immutable artifact digest (workflow_dispatch only)
        if: github.event_name == 'workflow_dispatch' && inputs.manifest_digest != ''
        env:
          PUBLICATION_ID: ${{ inputs.publication_id }}
          ARTIFACT_URL: ${{ inputs.artifact_url }}
          MANIFEST_DIGEST: ${{ inputs.manifest_digest }}
        run: |
          set -euo pipefail
          curl -fsSL "$ARTIFACT_URL" -o /tmp/artifact.tar.gz
          rm -rf /tmp/pages-dist
          mkdir -p /tmp/pages-dist
          tar -xzf /tmp/artifact.tar.gz -C /tmp/pages-dist
          echo "$MANIFEST_DIGEST  /tmp/pages-dist/manifest.json" | sha256sum -c -
          test -f /tmp/pages-dist/SHA256SUMS
          echo "verified artifact $PUBLICATION_ID ($MANIFEST_DIGEST)"

      - name: Verify exact Pages artifact tree
        run: |
          set -euo pipefail
          test -f /tmp/pages-dist/index.html
          test -f /tmp/pages-dist/soymutdb-jbrowse/index.html
          (
            cd /tmp/pages-dist
            sha256sum -c SHA256SUMS
          )

      - name: Prepare Pages deployment branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan gh-pages
          git rm -rf --quiet . >/dev/null 2>&1 || true
          # The verified artifact lives outside the checkout and therefore
          # survives this cleanup unchanged.
          git clean -fdx >/dev/null 2>&1 || true
          cp -r /tmp/pages-dist/. .
          test -f index.html
          test -f soymutdb-jbrowse/index.html

      - name: Verify deployed Pages tree is byte-identical
        run: |
          set -euo pipefail
          find /tmp/pages-dist -type f -printf '%P\n' | LC_ALL=C sort > /tmp/pages-expected-files
          find . -path './.git' -prune -o -type f -printf '%P\n' | LC_ALL=C sort > /tmp/pages-actual-files
          diff -u /tmp/pages-expected-files /tmp/pages-actual-files
          sha256sum -c /tmp/pages-dist/SHA256SUMS

      - name: Deploy all apps to pages (gh-pages) branch
        run: |
          set -euo pipefail
          git add -A
          git commit -m "deploy(web): $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push origin gh-pages --force
