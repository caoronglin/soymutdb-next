# =============================================================================
# SoyMutDB Next — Deploy public web to GitHub Pages (pages (gh-pages) branch)
#
# Trigger: push to main + manual dispatch. Builds web/admin/JBrowse and force-pushes
# the static dist to the `pages` branch (Pages source = pages (gh-pages) branch, /).
# Only static hosting — no API proxying (API stays on the self-hosted backend).
#
# NOTE: set the production API origin as a repository secret named
# API_BASE_URL (e.g. https://api.example.com). If unset, the app falls back
# to its compiled-in default.
# =============================================================================
name: Deploy Web to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Build web + publish pages (gh-pages) branch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install pnpm 10
        uses: pnpm/action-setup@v4
        with:
          version: 10.0.0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Use official npm registry
        run: pnpm config set registry https://registry.npmjs.org/

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build web (SSG + assets)
        env:
          VITE_API_BASE_URL: ${{ secrets.API_BASE_URL }}
          VITE_CDN_ENABLED: "false"
          # JBrowse app URL (must match CSP frame-src). Set the repository
          # secret JBROWSE_URL (e.g. https://<site>/soymutdb-jbrowse/).
          # Unset -> iframe falls back to localhost:5175 (blocked by CSP).
          VITE_JBROWSE_URL: ${{ secrets.JBROWSE_URL }}
          # Content snapshot for SSG content pages (news/about).
          # Set the repository secret CONTENT_SNAPSHOT_URL to the production
          # API endpoint (e.g. https://api.example.com/api/v1/content/snapshot).
          # Missing URL -> fetch-content-snapshot.ts exits 1 (fail-fast) so
          # CI never silently ships stale content pages.
          CONTENT_SNAPSHOT_URL: ${{ secrets.CONTENT_SNAPSHOT_URL }}
        run: pnpm --filter @soymutdb/web build

      - name: Build admin and JBrowse
        run: |
          pnpm --filter @soymutdb/admin build:web
          pnpm --filter @soymutdb/jbrowse build

      - name: Smoke test static content (news/about/sitemap)
        env:
          CONTENT_SNAPSHOT_URL: ${{ secrets.CONTENT_SNAPSHOT_URL }}
        run: pnpm --filter @soymutdb/web exec tsx scripts/smoke-pages.ts

      - name: Deploy all apps to pages (gh-pages) branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stage dist BEFORE the orphan checkout: git clean -fdx would wipe
          # the untracked (gitignored) dist folder.
          mkdir -p /tmp/pages-dist
          cp -r apps/web/dist/. /tmp/pages-dist/
          mkdir -p /tmp/pages-dist/soymutdb-admin /tmp/pages-dist/soymutdb-jbrowse
          cp -r apps/admin/dist/. /tmp/pages-dist/soymutdb-admin/
          # Publish the dist-jbrowse artifact under the stable JBrowse path.
          cp -r apps/jbrowse/dist/. /tmp/pages-dist/soymutdb-jbrowse/
          git checkout --orphan gh-pages
          git rm -rf --quiet . >/dev/null 2>&1 || true
          # Wipe untracked leftovers too (node_modules, pnpm symlinks) so the
          # pages (gh-pages) branch carries only static files.
          git clean -fdx >/dev/null 2>&1 || true
          cp -r /tmp/pages-dist/. .
          # SPA fallback: GitHub Pages serves 404.html for unknown paths.
          cp /tmp/pages-dist/index.html ./404.html
          # Pure static hosting — skip Jekyll processing.
          test -f index.html
          test -f soymutdb-admin/index.html
          test -f soymutdb-jbrowse/index.html
          touch .nojekyll
          git add -A
          git commit -m "deploy(web): $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push origin gh-pages --force
