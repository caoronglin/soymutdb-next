# =============================================================================
# SoyMutDB Next — Deploy public demo to GitHub Pages (gh-pages branch)
#
# Trigger: push to main + manual dispatch. Builds the public portal and JBrowse,
# then force-pushes the static demo to `gh-pages`. No API/worker is deployed;
# API requests use the same-origin /api/v1 demo URL and render existing
# unavailable/empty states on GitHub Pages.
# =============================================================================
name: Deploy Web to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publication_id:
        description: "Immutable static publication id (Phase 3)."
        required: true
        default: ""
      artifact_url:
        description: "URL of the immutable artifact to download + verify."
        required: true
        default: ""
      manifest_digest:
        description: "SHA-256 of the artifact's manifest.json (digest verification)."
        required: true
        default: ""

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Build web + publish pages (gh-pages) branch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install pnpm 10
        uses: pnpm/action-setup@v4
        with:
          version: 10.0.0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Use official npm registry
        run: pnpm config set registry https://registry.npmjs.org/

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build web (SSG + assets)
        env:
          VITE_DEPLOYMENT_MODE: demo
          VITE_BASE_URL: /soymutdb-next/
          VITE_API_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/api/v1
          VITE_CDN_ENABLED: "false"
          VITE_JBROWSE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/soymutdb-jbrowse/
        run: pnpm --filter @soymutdb/web build

      - name: Build JBrowse demo
        env:
          VITE_BASE_URL: /soymutdb-next/soymutdb-jbrowse/
          VITE_JBROWSE_DATA_URL: /soymutdb-next/jbrowse-data
        run: pnpm --filter @soymutdb/jbrowse build

      - name: Smoke test static content (news/about/sitemap)
        run: pnpm --filter @soymutdb/web exec tsx scripts/smoke-pages.ts

      - name: Verify immutable artifact digest (workflow_dispatch only)
        if: github.event_name == 'workflow_dispatch' && inputs.manifest_digest != ''
        env:
          PUBLICATION_ID: ${{ inputs.publication_id }}
          ARTIFACT_URL: ${{ inputs.artifact_url }}
          MANIFEST_DIGEST: ${{ inputs.manifest_digest }}
        run: |
          set -euo pipefail
          curl -fsSL "$ARTIFACT_URL" -o /tmp/artifact.tar.gz
          mkdir -p /tmp/artifact
          tar -xzf /tmp/artifact.tar.gz -C /tmp/artifact
          echo "$MANIFEST_DIGEST  /tmp/artifact/manifest.json" | sha256sum -c -
          echo "verified artifact $PUBLICATION_ID ($MANIFEST_DIGEST)"

      - name: Deploy all apps to pages (gh-pages) branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stage dist BEFORE the orphan checkout: git clean -fdx would wipe
          # the untracked (gitignored) dist folder.
          mkdir -p /tmp/pages-dist
          cp -r apps/web/dist/. /tmp/pages-dist/
          mkdir -p /tmp/pages-dist/soymutdb-jbrowse
          # Publish the dist-jbrowse artifact under the stable JBrowse path.
          cp -r apps/jbrowse/dist/. /tmp/pages-dist/soymutdb-jbrowse/
          git checkout --orphan gh-pages
          git rm -rf --quiet . >/dev/null 2>&1 || true
          # Wipe untracked leftovers too (node_modules, pnpm symlinks) so the
          # pages (gh-pages) branch carries only static files.
          git clean -fdx >/dev/null 2>&1 || true
          cp -r /tmp/pages-dist/. .
          # SPA fallback: GitHub Pages serves 404.html for unknown paths.
          cp /tmp/pages-dist/index.html ./404.html
          # Pure static hosting — skip Jekyll processing.
          test -f index.html
          test -f soymutdb-jbrowse/index.html
          touch .nojekyll
          git add -A
          git commit -m "deploy(web): $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push origin gh-pages --force
