# =============================================================================
# SoyMutDB Next — E2E online smoke test (deployed gh-pages site)
#
# Target : https://caoronglin.github.io/soymutdb-next/ (fixed in
#          e2e/playwright.config.ts; SMOKE_BASE_URL can override)
# Covers : 1) resource loading (no 4xx/5xx, same-origin js/css must load)
#          2) route rendering (non-blank, no "Not Found", h1/h2 present)
#          3) script health (zero pageerror / console.error per page)
#          Full assertion contract: e2e/README.md
#
# Triggers:
#   * schedule       — nightly, 02:00 UTC
#   * workflow_dispatch — manual run from the Actions tab
#   * workflow_run   — after "Deploy Web to Pages" (pages.yml) completes
#                      successfully, smoke-test the freshly deployed site
#
# Note: e2e/ is an independent npm package (own package.json + lockfile),
# intentionally outside the pnpm workspace — no root package.json changes.
#
# MIRROR NOTICE: the authoritative nightly smoke job is the CNB `smoke`
# pipeline (`.cnb.yml` -> "crontab: 0 2 * * *"). Both run the same
# e2e/tests/online-smoke.spec.ts assertions against a deployed site.
# =============================================================================
name: E2E Smoke (online)

on:
  # PRs verify the proposed frontend artifact against an offline deterministic
  # Playwright server. Online checks remain for schedule/post-deploy/manual only.
  pull_request:
    # Changes to the portal, its shared packages, locks, and static build gates
    # must exercise the built PR artifact, not only edits to Playwright tests.
    paths:
      - "e2e/**"
      - ".github/workflows/e2e-smoke.yml"
      - "apps/web/**"
      - "apps/jbrowse/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "scripts/build-pages-artifact.sh"
      - "scripts/build-static-apps.sh"
      - "scripts/verify-frontend-artifacts.sh"
      - "scripts/verify-pages-artifact.sh"
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy Web to Pages"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: e2e-smoke-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Online smoke test (gh-pages)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # workflow_run fires for every Pages workflow conclusion. Only smoke-test a
    # successful Pages deployment triggered from this repository's main branch;
    # this prevents a no-op foreign/non-main Pages run from testing an old site.
    if: >-
      github.event_name != 'pull_request' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - name: Setup Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26.10.0
          # e2e installs with npm (independent package), so cache the npm
          # store keyed on e2e/package-lock.json — NOT the pnpm store (this
          # job never installs the root workspace).
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install e2e dependencies (independent package)
        working-directory: e2e
        run: npm ci

      - name: Install Chromium (with system deps)
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      # GitHub Pages publishes asynchronously after pages.yml pushes to the
      # gh-pages branch — give the new deployment a moment to propagate so
      # the post-deploy run never tests the previous release.
      - name: Wait for GitHub Pages propagation (post-deploy runs only)
        if: github.event_name == 'workflow_run'
        run: sleep 60

      - name: Run online smoke tests
        working-directory: e2e
        env:
          # Set to a mirror when GitHub-hosted runners cannot reach the
          # default Playwright CDN (e.g. npmmirror):
          #   PLAYWRIGHT_DOWNLOAD_HOST: https://npmmirror.com/mirrors/playwright/
          CI: "1"
        run: npx playwright test

      - name: Upload failure artifacts (HTML report + test-results)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-smoke-failure
          path: |
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: ignore
          retention-days: 14

  pr-artifact:
    name: PR artifact E2E (offline mock API)
    # Never compare a PR's new routes to an older gh-pages deployment.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 12.5.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26.10.0
          cache: pnpm
      - name: Frozen workspace install
        run: pnpm install --frozen-lockfile
      - name: Build current PR public artifact (demo, same-origin API mock)
        env:
          VITE_DEPLOYMENT_MODE: demo
          VITE_BASE_URL: /soymutdb-next/
          VITE_API_BASE_URL: http://localhost:4173/soymutdb-next/api/v1
          VITE_JBROWSE_BASE_URL: http://localhost:4173/soymutdb-next/soymutdb-jbrowse/
        run: pnpm --filter @soymutdb/web build
      - name: Install offline browser suite
        working-directory: e2e
        run: npm ci
      - name: Install Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium
      - name: Run PR's built-artifact browser acceptance
        working-directory: e2e
        env:
          CI: "1"
        run: npx playwright test -c playwright-public.config.ts
      - name: Upload PR browser failures
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr-artifact-e2e-failure
          path: |
            e2e/playwright-report-public
            e2e/test-results-public
          if-no-files-found: ignore
          retention-days: 14
