[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "soymutdb-jobs"
version = "0.1.0"
description = "SoyMutDB shared job contract: statuses, transitions, payload schemas, and task/queue constants shared by the API and the Celery worker"
requires-python = ">=3.15"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/soymutdb_jobs"]

[tool.ruff]
target-version = "py315"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
