[package]
name = "soymutdb-enrichment-core"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "soymutdb_enrichment_core"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "soymutdb-enrichment-sf"
path = "src/main.rs"

[features]
default = []
python = ["dep:pyo3", "pyo3/extension-module"]

[dependencies]
libm = "=0.2.16"
serde_json = "=1.0.151"
pyo3 = { version = "=0.29.3", optional = true }

[profile.release]
codegen-units = 1
lto = "thin"
