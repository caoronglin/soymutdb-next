# =====================================================================
# SoyMutDB - Docker Compose (Production)
# =====================================================================
# 主发布路径（与 deploy/scripts/upgrade.sh、deploy/linux/*.service 配套）：
#
#   - 所有传给 api/worker/beat/migrate 的配置变量使用 SOYMUTDB_ 前缀，
#     字段名与 apps/api/app/core/config.py 的 pydantic-settings 对齐
#     （APP_ENV 取值仅 dev|staging|prod，生产用 prod）。
#   - 应用镜像必须使用 registry digest 引用，tag 仅用于 CI 发现：
#       API_IMAGE_REF / WORKER_IMAGE_REF / MCP_IMAGE_REF / JBROWSE_IMAGE_REF
#   - 一次性数据库迁移由 migrate 服务负责（alembic upgrade head），
#     api/worker 依赖其成功完成（service_completed_successfully）。
#   - 前端静态站点（web/admin/jbrowse）已移出本 compose，由 Cloudflare
#     Pages 托管（后续任务）。nginx 仅反代 API 与 MinIO。
#   - 数据存储镜像均固定版本（无 :latest）。
#   - 端口冲突已解决：MinIO 数据 9001:9000、控制台 9002:9001。
# =====================================================================

# ------------------------------------------------------------------
# 应用服务共享环境（SOYMUTDB_ 前缀，与 config.py 字段一一对应）。
# 生产 fail-fast：JWT_SECRET / CORS 等缺失时 API 拒绝启动
# （config.py validate_security_configuration），upgrade.sh 会在发布前预检。
# ------------------------------------------------------------------
x-app-runtime: &app-runtime
  init: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

# ------------------------------------------------------------------
# 生产拓扑（release-only）
# ------------------------------------------------------------------
# 本文件只描述生产拓扑：每个发布服务用 `${*_IMAGE_REF:?…}` 固定 digest，缺失即
# 拒绝启动，且不携带任何 `build:` 定义——生产主机永远不会从仓库源码构建镜像，
# 这正是发布边界：流水线（scripts/build-release-image.sh + scripts/list-images.sh）
# 构建并签名镜像，生产只拉取 digest。
#
# 本地构建走独立入口（见 scripts/compose-local.sh）：
#   bash scripts/compose-local.sh build          # 直接用 docker build 构建 8 个镜像
#   bash scripts/compose-local.sh up -d          # 用上述镜像启动生产拓扑
#
# 实现方式：`scripts/compose-local.sh` 先 source scripts/list-images.sh，再用
# `docker build -f <Dockerfile> -t soymutdb-<name>:<tag>` 逐个构建（与发布流水线同一
# 批 Dockerfile），然后加载本文件 + 后置的 `docker-compose.local.yml`。Compose 对每个
# 文件分别插值，所以脚本在调用前为所有 `${…:?…}` 引用导出安全的本地值；override
# 随即用普通标量 `${API_IMAGE:-soymutdb-api:local}` 覆盖 `image:`。
#
# 为什么不在本文件保留 `build:` 再让 override `!reset` 掉：那是额外的失败面——
# 任何绕过 wrapper、直接 `docker compose build` 的调用都会从源码构建出未签名镜像。
# 只有在本地 override 里 `image:` 用普通标量而非 `!reset`：Compose 的 `!reset` 是
# 丢弃值（回到类型默认），在 `image:` 上用会把镜像清空。
# 为什么不在 `image:` 里塞 `${VAR:-${FALLBACK}}`：Compose 插值不支持嵌套默认
# 值，所以"生产必填 digest / 开发本地 tag"必须由变量本身表达——生产用
# `${API_IMAGE_REF:?…}`（缺失即失败），开发用 `API_IMAGE`。

x-app-env: &app-env
  SOYMUTDB_APP_ENV: prod
  # 缓存 Redis（服务名 redis，redis-cache 角色，allkeys-lru 可驱逐）
  SOYMUTDB_REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0
  # Celery broker/result 使用独立实例 redis-celery（noeviction + AOF，
  # 禁止驱逐策略，防止消息/结果丢失）；broker DB 0、result DB 1。
  SOYMUTDB_CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis-celery:6379/0
  SOYMUTDB_CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis-celery:6379/1
  # Celery result TTL（秒，默认 7 天，1-7 天范围内）
  SOYMUTDB_CELERY_RESULT_EXPIRES: ${SOYMUTDB_CELERY_RESULT_EXPIRES:-604800}
  # Worker sync engines are per Celery child process. One task runs per
  # child, so the production-safe default is exactly one connection each.
  SOYMUTDB_WORKER_DB_POOL_SIZE: ${SOYMUTDB_WORKER_DB_POOL_SIZE:-1}
  SOYMUTDB_WORKER_DB_MAX_OVERFLOW: ${SOYMUTDB_WORKER_DB_MAX_OVERFLOW:-0}
  SOYMUTDB_S3_ENDPOINT: http://minio:9000
  SOYMUTDB_S3_ACCESS_KEY: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
  SOYMUTDB_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
  SOYMUTDB_S3_PUBLIC_BUCKET: genomic-data
  SOYMUTDB_S3_PRIVATE_BUCKET: user-tracks
  SOYMUTDB_S3_BLAST_BUCKET: blast-dbs
  SOYMUTDB_S3_EXPORT_BUCKET: exports
  SOYMUTDB_S3_GWAS_BUCKET: ${S3_GWAS_BUCKET:-gwas}
  SOYMUTDB_S3_ANALYSES_BUCKET: ${S3_ANALYSES_BUCKET:-analyses}
  # 生产必填（此处无默认值：缺失时 prod 校验失败、API 拒绝启动）：
  SOYMUTDB_JWT_SECRET: ${SOYMUTDB_JWT_SECRET:-}
  # Analytics IP pseudonymisation salt is mandatory in production (config.py).
  SOYMUTDB_ANALYTICS_IP_SALT: ${SOYMUTDB_ANALYTICS_IP_SALT:-}
  SOYMUTDB_CORS_ORIGINS: ${SOYMUTDB_CORS_ORIGINS:-}
  SOYMUTDB_ADMIN_EMAIL: ${SOYMUTDB_ADMIN_EMAIL:-}
  SOYMUTDB_ADMIN_PASSWORD: ${SOYMUTDB_ADMIN_PASSWORD:-}

services:
  # ------------------------------------------------------------------
  # Data stores
  # ------------------------------------------------------------------
  # PostgreSQL fleet budget (default max_connections=100):
  #   API: 2 processes x (pool 3 + overflow 2)              <= 10
  #   Celery prefork children: 4 + 2 + 2 + 2, each pool 1  <= 10
  #   migrate / admin / exporter / operational reserve      <= 20
  #   ----------------------------------------------------------------
  #   supported profile total                               <= 40
  # Pools are per OS process, not per container. Any increase in replicas,
  # API workers, Celery concurrency, pool size, or overflow must update this
  # calculation. Introduce PgBouncer before sustained horizontal scaling.
  postgres:
    profiles: [ "core" ]
    image: postgres:18.6-alpine
    # pg_stat_statements must be preloaded before the extension can collect.
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "pg_stat_statements.track=all", "-c", "pg_stat_statements.max=10000"]
    environment:
      POSTGRES_DB: soymutdb
      POSTGRES_USER: soymutdb
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # PostgreSQL 18 moved PGDATA to the pg_ctlcluster layout and its declared
      # VOLUME from /var/lib/postgresql/data to /var/lib/postgresql
      # (`ENV PGDATA /var/lib/postgresql/18/docker`, docker-library/postgres
      # 18/alpine). Mounting the old path leaves the real data directory on the
      # anonymous container layer, so a recreate loses the release.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U soymutdb -d soymutdb" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # 缓存 Redis（redis-cache 角色）：allkeys-lru 允许驱逐，仅服务 API 缓存/
  # 限流/会话；Celery 绝不使用本实例（防止消息被驱逐丢失）。
  redis:
    profiles: [ "core" ]
    image: redis:7.4-alpine
    command: >
      redis-server --appendonly yes --maxmemory ${REDIS_CACHE_MAXMEMORY:-512mb} --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Celery broker/result Redis：noeviction（禁止任何驱逐——消息/结果不可丢），
  # 开 AOF 持久化；broker 用 DB 0、result 用 DB 1。仅发布 localhost:6380
  # 供 conda 混合部署使用。
  redis-celery:
    profiles: [ "core" ]
    image: redis:7.4-alpine
    command: >
      redis-server --appendonly yes --maxmemory ${REDIS_CELERY_MAXMEMORY:-512mb} --maxmemory-policy noeviction --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redis-celerydata:/data
    # Conda hybrid deployments use this localhost-only broker endpoint.
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    profiles: [ "core" ]
    # Docker Hub's `minio/minio` repository returns 404, so this topology uses
    # the official upstream image published on quay.io. The pinned release tag
    # was verified by the primary agent against the quay.io registry: HEAD HTTP
    # 200 with an index digest beginning sha256:1dce27c. It keeps the upstream
    # image contract this service needs: ENTRYPOINT
    # /usr/bin/docker-entrypoint.sh, CMD ["minio"], VOLUME /data, and a bundled
    # curl for the healthcheck, so `server /data --console-address ":9001"`
    # runs unchanged. See scripts/test_development_compose_contract.py.
    image: quay.io/minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    ports:
      - "127.0.0.1:9001:9000" # S3 API (host 9001 -> container 9000)
      - "127.0.0.1:9002:9001" # Web console (host 9002 -> container 9001)
    volumes:
      - miniodata:/data
    networks:
      default:
      tunnel-backend:
        aliases: ["minio-tunnel"]
      local-data-proxy:
        aliases: ["minio-local"]
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  minio-init:
    profiles: [ "core" ]
    # Docker Hub no longer hosts `minio/mc`, so this one-shot job uses the
    # official upstream client published on quay.io. The pinned release tag was
    # verified by the primary agent against the quay.io registry: HEAD HTTP 200
    # with an index digest beginning sha256:993e8c. It keeps the upstream
    # ENTRYPOINT `/usr/bin/mc`, which is exactly the path this one-shot
    # bucket/policy/versioning job invokes.
    image: quay.io/minio/mc:RELEASE.2024-11-21T17-21-54Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c " /usr/bin/mc alias set local http://minio:9000 ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required} ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}; /usr/bin/mc mb --ignore-existing local/genomic-data; /usr/bin/mc mb --ignore-existing local/user-tracks; /usr/bin/mc mb --ignore-existing local/blast-dbs; /usr/bin/mc mb --ignore-existing local/exports; /usr/bin/mc mb --ignore-existing local/gwas; /usr/bin/mc mb --ignore-existing local/analyses; /usr/bin/mc policy set public local/genomic-data; /usr/bin/mc version enable local/user-tracks; exit 0; "
    restart: "no"

  # ------------------------------------------------------------------
  # One-shot database migration (alembic upgrade head, idempotent)
  # API/worker 在 migrate 成功完成后才启动（service_completed_successfully）。
  # 注意：migrations/env.py 会调用 get_settings()（prod fail-fast 校验），
  # 因此 migrate 必须注入与 api 相同的完整 SOYMUTDB_* 环境。
  # ------------------------------------------------------------------
  migrate:
    profiles: [ "core" ]
    # 独立镜像：与 api/worker 一样使用 digest 引用（见 deploy/.env.example）。
    # 此前复用 API_IMAGE_REF，导致"迁移步骤"绑定在 API 的 tag 上，而 api 服务
    # 已经切到 release digest——一次只更新 digest 的发布会让 Docker 继续跑上
    # 一个 release 的迁移。三个引用各自独立后，migrate = 「当前 release 的迁移」。
    image: ${MIGRATE_IMAGE_REF:?MIGRATE_IMAGE_REF is required as image@sha256 - see deploy/.env.example}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *app-env
      SOYMUTDB_DATABASE_URL: postgresql+asyncpg://soymutdb:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/soymutdb
    command: [ "alembic", "upgrade", "head" ]
    restart: "no"

  # ------------------------------------------------------------------
  # Application services
  # ------------------------------------------------------------------
  api:
    <<: *app-runtime
    profiles: [ "core" ]
    # 生产：CI 发布的 digest 引用，缺失即拒绝启动。
    # 本地：scripts/compose-local.sh 加载后置的 docker-compose.local.yml，改用普通
    # 变量 `API_IMAGE`（默认本地 tag）。
    image: ${API_IMAGE_REF:?API_IMAGE_REF is required as image@sha256 - see deploy/.env.example}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-celery:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *app-env
      SOYMUTDB_DATABASE_URL: postgresql+asyncpg://soymutdb:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/soymutdb
      SOYMUTDB_API_WORKERS: ${SOYMUTDB_API_WORKERS:-2}
      SOYMUTDB_API_GRACEFUL_SHUTDOWN_SECONDS: ${SOYMUTDB_API_GRACEFUL_SHUTDOWN_SECONDS:-30}
      # Trust forwarding headers only from the two proxy-only networks below.
      SOYMUTDB_FORWARDED_ALLOW_IPS: ${SOYMUTDB_FORWARDED_ALLOW_IPS:-172.30.252.0/28,172.30.253.0/28}
      # Per-process pool budget: 2 API workers x (3 + 2) = at most 10.
      SOYMUTDB_DB_POOL_SIZE: ${SOYMUTDB_DB_POOL_SIZE:-3}
      SOYMUTDB_DB_MAX_OVERFLOW: ${SOYMUTDB_DB_MAX_OVERFLOW:-2}
      # Deployment-only plugin signing material is intentionally API-scoped;
      # workers, beat, and migrations must not receive this secret.
      SOYMUTDB_PLUGIN_MANIFEST_SIGNING_KEY: ${SOYMUTDB_PLUGIN_MANIFEST_SIGNING_KEY:-}
      SOYMUTDB_PLUGIN_MANIFESTS_JSON: ${SOYMUTDB_PLUGIN_MANIFESTS_JSON:-[]}
    expose:
      - "8010"
    networks:
      default:
      api-proxy:
        aliases: ["api-local"]
      tunnel-api:
        aliases: ["api-tunnel"]
    healthcheck:
      # Liveness（readiness 由发布脚本轮询 /api/v1/health/ready）
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8010/api/v1/health/live', timeout=5)" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: ${API_MEMORY_LIMIT:-2g}
    cpus: ${API_CPU_LIMIT:-2.0}
    pids_limit: ${API_PIDS_LIMIT:-512}
    stop_grace_period: ${API_STOP_GRACE_PERIOD:-45s}
    restart: unless-stopped

  # Queue contract: ingest / export / stats / cleanup / blast / analyses / default
  # 分工（按资源合理性）：
  #   - worker-default / worker-ingest 消费非 BLAST 队列
  #     （ingest,export,stats,cleanup,default），两个实例并行分摊负载；
  #   - worker-blast 独占 blast 队列（CPU 密集，低并发隔离）。
  # ------------------------------------------------------------------
  # Celery workers. Each service listens on a subset of queues.
  # ------------------------------------------------------------------
  worker-default:
    <<: *app-runtime
    profiles: [ "core" ]
    image: ${WORKER_IMAGE_REF:?WORKER_IMAGE_REF is required as image@sha256 - see deploy/.env.example}
    depends_on:
      postgres:
        condition: service_healthy
      redis-celery:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *app-env
      SOYMUTDB_DATABASE_URL: postgresql+psycopg://soymutdb:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/soymutdb
      SOYMUTDB_WECOM_BOT_WEBHOOK: ${SOYMUTDB_WECOM_BOT_WEBHOOK:-}
    command: >
      celery -A soymutdb_worker.main:celery_app worker --loglevel=info --queues=ingest,export,stats,cleanup,default --concurrency=${WORKER_DEFAULT_CONCURRENCY:-4} --max-tasks-per-child=100 --hostname=worker-default@%h
    # Prometheus /metrics (container network only, never published to host)
    expose:
      - "9808"
    healthcheck:
      test: [ "CMD-SHELL", "celery -A soymutdb_worker.main:celery_app inspect ping -d worker-default@$$HOSTNAME || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    mem_limit: ${WORKER_DEFAULT_MEMORY_LIMIT:-4g}
    cpus: ${WORKER_DEFAULT_CPU_LIMIT:-4.0}
    pids_limit: ${WORKER_PIDS_LIMIT:-512}
    stop_grace_period: ${WORKER_STOP_GRACE_PERIOD:-5m}
    restart: unless-stopped

  worker-blast:
    <<: *app-runtime
    profiles: [ "blast" ]
    image: ${WORKER_IMAGE_REF:?WORKER_IMAGE_REF is required as image@sha256 - see deploy/.env.example}
    depends_on:
      postgres:
        condition: service_healthy
      redis-celery:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *app-env
      SOYMUTDB_DATABASE_URL: postgresql+psycopg://soymutdb:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/soymutdb
      SOYMUTDB_WECOM_BOT_WEBHOOK: ${SOYMUTDB_WECOM_BOT_WEBHOOK:-}
    command: >
      celery -A soymutdb_worker.main:celery_app worker --loglevel=info --queues=blast --concurrency=${WORKER_BLAST_CONCURRENCY:-2} --max-tasks-per-child=50 --hostname=worker-blast@%h
    # Prometheus /metrics (container network only, never published to host)
    expose:
      - "9808"
    healthcheck:
      test: [ "CMD-SHELL", "celery -A soymutdb_worker.main:celery_app inspect ping -d worker-blast@$$HOSTNAME || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    mem_limit: ${WORKER_BLAST_MEMORY_LIMIT:-8g}
    cpus: ${WORKER_BLAST_CPU_LIMIT:-4.0}
    pids_limit: ${WORKER_PIDS_LIMIT:-512}
    stop_grace_period: ${WORKER_BLAST_STOP_GRACE_PERIOD:-10m}
    restart: unless-stopped

  worker-ingest:
    <<: *app-runtime
    profiles: [ "core" ]
    image: ${WORKER_IMAGE_REF:?WORKER_IMAGE_REF is required as image@sha256 - see deploy/.env.example}
    depends_on:
      postgres:
        condition: service_healthy
      redis-celery:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *app-env
      SOYMUTDB_DATABASE_URL: postgresql+psycopg://soymutdb:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/soymutdb
      SOYMUTDB_WECOM_BOT_WEBHOOK: ${SOYMUTDB_WECOM_BOT_WEBHOOK:-}
    command: >
      celery -A soymutdb_worker.main:celery_app worker --loglevel=info --queues=ingest,export,stats,cleanup,default --concurrency=${WORKER_INGESTION_CONCURRENCY:-2} --max-tasks-per-child=20 --hostname=worker-ingest@%h
    # Prometheus /metrics (container network only, never published to host)
    expose:
      - "9808"
    healthcheck:
      test: [ "CMD-SHELL", "celery -A soymutdb_worker.main:celery_app inspect ping -d worker-ingest@$$HOSTNAME || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    mem_limit: ${WORKER_INGEST_MEMORY_LIMIT:-4g}
    cpus: ${WORKER_INGEST_CPU_LIMIT:-2.0}
    pids_limit: ${WORKER_PIDS_LIMIT:-512}
    stop_grace_period: ${WORKER_STOP_GRACE_PERIOD:-5m}
    restart: unless-stopped

  worker-analyses:
    <<: *app-runtime
    profiles: [ "analyses" ]
    image: ${WORKER_IMAGE_REF:?WORKER_IMAGE_REF is required as image@sha256 - see deploy/.env.example}
    depends_on:
      postgres:
        condition: service_healthy
      redis-celery:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *app-env
      SOYMUTDB_DATABASE_URL: postgresql+psycopg://soymutdb:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/soymutdb
      SOYMUTDB_WECOM_BOT_WEBHOOK: ${SOYMUTDB_WECOM_BOT_WEBHOOK:-}
    command: >
      celery -A soymutdb_worker.main:celery_app worker --loglevel=info
      --queues=analyses --concurrency=${WORKER_ANALYSES_CONCURRENCY:-2}
      --max-tasks-per-child=20 --hostname=worker-analyses@%h
    expose:
      - "9808"
    healthcheck:
      test: [ "CMD-SHELL", "celery -A soymutdb_worker.main:celery_app inspect ping -d worker-analyses@$$HOSTNAME || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    mem_limit: ${WORKER_ANALYSES_MEMORY_LIMIT:-8g}
    cpus: ${WORKER_ANALYSES_CPU_LIMIT:-4.0}
    pids_limit: ${WORKER_PIDS_LIMIT:-512}
    stop_grace_period: ${WORKER_STOP_GRACE_PERIOD:-5m}
    restart: unless-stopped

  beat:
    <<: *app-runtime
    profiles: [ "core" ]
    image: ${WORKER_IMAGE_REF:?WORKER_IMAGE_REF is required as image@sha256 - see deploy/.env.example}
    depends_on:
      redis-celery:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      SOYMUTDB_APP_ENV: prod
      SOYMUTDB_CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis-celery:6379/0
      SOYMUTDB_CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis-celery:6379/1
    command: >
      celery -A soymutdb_worker.main:celery_app beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    # Prometheus /metrics (container network only, never published to host)
    expose:
      - "9808"
    healthcheck:
      test: [ "CMD-SHELL", "test -f /tmp/celerybeat-schedule || exit 1" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    mem_limit: ${BEAT_MEMORY_LIMIT:-512m}
    cpus: ${BEAT_CPU_LIMIT:-0.5}
    pids_limit: ${WORKER_PIDS_LIMIT:-512}
    stop_grace_period: ${BEAT_STOP_GRACE_PERIOD:-30s}
    restart: unless-stopped

  # ------------------------------------------------------------------
  # MCP Server (FastMCP, Streamable HTTP) - B1 skeleton
  # 工具为 stub，穿透调用内部 REST API（SOYMUTDB_API_BASE -> api:8010）。
  # 写工具鉴权用 SOYMUTDB_MCP_API_TOKEN（Bearer 透传）；60/min 限流占位，
  # 由 G3 门禁在传输层实现。端口仅容器网络可见（expose，不发布到宿主机——
  # 独立端口避免与对象存储发生冲突）；对外经 nginx /mcp/ 反代（SSE 配置见
  # infra/nginx/conf.d/default.conf）。
  # ------------------------------------------------------------------
  mcp-server:
    <<: *app-runtime
    profiles: [ "mcp" ]
    image: ${MCP_IMAGE_REF:?MCP_IMAGE_REF is required as image@sha256 - see deploy/.env.example}
    depends_on:
      api:
        condition: service_healthy
    environment:
      SOYMUTDB_API_BASE: http://api:8010
      SOYMUTDB_MCP_API_TOKEN: ${SOYMUTDB_MCP_API_TOKEN:?SOYMUTDB_MCP_API_TOKEN is required}
      SOYMUTDB_MCP_REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0
    expose:
      - "9000"
    networks:
      default:
      local-mcp-proxy:
        aliases: ["mcp-local"]
    command: [ "python", "-m", "mcp_server.server", "--host", "0.0.0.0", "--port", "9000" ]
    healthcheck:
      test: [ "CMD", "python", "-c", "import json, os, urllib.request; payload = json.dumps({'jsonrpc': '2.0', 'id': 1, 'method': 'initialize', 'params': {'protocolVersion': '2024-11-05', 'capabilities': {}, 'clientInfo': {'name': 'healthcheck', 'version': '1'}}}).encode(); request = urllib.request.Request('http://localhost:9000/mcp', method='POST', data=payload, headers={'Authorization': 'Bearer ' + os.environ['SOYMUTDB_MCP_API_TOKEN'], 'Content-Type': 'application/json', 'Accept': 'application/json, text/event-stream'}); response = urllib.request.urlopen(request, timeout=3); assert 200 <= response.status < 300" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    mem_limit: ${MCP_MEMORY_LIMIT:-1g}
    cpus: ${MCP_CPU_LIMIT:-1.0}
    pids_limit: ${MCP_PIDS_LIMIT:-256}
    stop_grace_period: ${MCP_STOP_GRACE_PERIOD:-30s}
    restart: unless-stopped

  # Optional self-hosted JBrowse runtime. The default production topology uses
  # static hosting, so this profile binds to loopback and is enabled only when
  # an operator explicitly selects it.
  jbrowse:
    profiles: [ "jbrowse" ]
    image: ${JBROWSE_IMAGE_REF:?JBROWSE_IMAGE_REF is required as image@sha256 - see deploy/.env.example}
    ports:
      - "${JBROWSE_BIND_ADDRESS:-127.0.0.1}:${JBROWSE_PORT:-8082}:80"
    healthcheck:
      test: [ "CMD-SHELL", "wget --spider -q http://localhost/ || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # ------------------------------------------------------------------
  # Reverse proxy（仅反代 API 与 MinIO；前端静态由 Cloudflare Pages 托管）
  # infra/nginx 中 web/admin/jbrowse 上游定义保留（禁止改动），但对应
  # 容器已移除；若直接解析会因主机不存在导致 nginx 启动失败（emerg），
  # 故用 extra_hosts 将三个名字钉到 127.0.0.1——相关 location 将返回
  # 502/504，直到 Cloudflare 域名层接管。
  # ------------------------------------------------------------------
  nginx:
    profiles: [ "core" ]
    image: nginx:1.27-alpine
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/conf.d:/etc/nginx/conf.d:ro
    extra_hosts:
      - "web:127.0.0.1"
      - "admin:127.0.0.1"
      - "jbrowse:127.0.0.1"
    networks:
      - api-proxy
      - local-data-proxy
      - local-mcp-proxy
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:80/health" ]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # ------------------------------------------------------------------
  # Cloudflare Tunnel origin and connector (optional)
  #
  # The connector is isolated on cloudflare-edge and can reach application
  # services only through tunnel-origin.  Do not point a public hostname at
  # nginx, api, MinIO, or another Compose service: tunnel-origin is the
  # intentionally narrow public surface (API, public genomic data, health).
  # Start explicitly with: docker compose --profile cloudflare-tunnel up -d
  # ------------------------------------------------------------------
  tunnel-origin:
    image: nginx:1.27-alpine
    profiles:
      - "cloudflare-tunnel"
    depends_on:
      api:
        condition: service_healthy
      minio:
        condition: service_healthy
    entrypoint: [ "nginx" ]
    command: [ "-g", "daemon off;" ]
    user: "101:101"
    expose:
      - "8081"
    networks:
      - tunnel-api
      - tunnel-backend
      - cloudflare-edge
    volumes:
      - ./infra/nginx/cloudflare-tunnel.conf:/etc/nginx/nginx.conf:ro
    tmpfs:
      - /tmp
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: [ "CMD-SHELL", "wget --spider -q http://localhost:8081/health || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:2025.2.1
    profiles:
      - "cloudflare-tunnel"
    depends_on:
      tunnel-origin:
        condition: service_healthy
    command:
      - tunnel
      - --no-autoupdate
      - --metrics
      - 0.0.0.0:2000
      - run
      - --token-file
      - /run/secrets/cloudflare_tunnel_token
    secrets:
      - cloudflare_tunnel_token
    networks:
      - cloudflare-edge
    expose:
      - "2000"
    tmpfs:
      - /tmp
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  # ------------------------------------------------------------------
  # Monitoring
  # ------------------------------------------------------------------
  # Prometheus exporters（仅容器网络内可见，expose 不映射到宿主机）。
  # 数据存储镜像均固定版本；exporter 同样固定稳定版，禁止裸 latest。
  # ------------------------------------------------------------------

  # PostgreSQL exporter：凭据与 api/migrate 同源（SOYMUTDB_DATABASE_URL 同款
  # 用户名/密码/库名，仅 host 指向 postgres 服务名）。
  postgres-exporter:
    profiles: [ "core" ]
    image: prometheuscommunity/postgres-exporter:v0.15.0
    environment:
      DATA_SOURCE_NAME: "postgresql://soymutdb:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/soymutdb?sslmode=disable"
    expose:
      - "9187"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget -q -O /dev/null http://localhost:9187/ || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # Redis exporter：单实例抓取缓存 redis 与 celery broker/result 双实例
  # （REDIS_ADDR 逗号分隔；两实例共用同一密码）。指标带 redis_instance 标签。
  redis-exporter:
    profiles: [ "core" ]
    image: oliver006/redis-exporter:v1.60.0
    environment:
      REDIS_ADDR: "redis://redis:6379,redis://redis-celery:6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    expose:
      - "9121"
    depends_on:
      redis:
        condition: service_healthy
      redis-celery:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget -q -O /dev/null http://localhost:9121/ || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # node-exporter：宿主磁盘/CPU/内存监控（磁盘 >85% 告警依赖）。
  # 只读挂载宿主根文件系统到 /host，经 --path.rootfs 报告 host 指标。
  node-exporter:
    profiles: [ "core" ]
    image: prom/node-exporter:v1.8.2
    command:
      - "--path.rootfs=/host"
      - "--collector.textfile.directory=/textfile"
    volumes:
      - /:/host:ro,rslave
      - ${BACKUP_METRICS_DIR:-/var/lib/node_exporter/textfile_collector}:/textfile:ro
    expose:
      - "9100"
    healthcheck:
      test: [ "CMD-SHELL", "wget -q -O /dev/null http://localhost:9100/metrics || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # Alert delivery is intentionally fail-closed. The service refuses to start
  # unless ALERTMANAGER_WEBHOOK_URL_FILE points to a non-empty HTTPS URL file;
  # the URL is mounted as a Docker secret and never committed to the repository.
  alertmanager:
    profiles: [ "core" ]
    image: prom/alertmanager:v0.28.1
    entrypoint: [ "/bin/sh", "/etc/alertmanager/start-alertmanager.sh" ]
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
      - "--web.listen-address=:9093"
    volumes:
      - ./infra/monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./infra/monitoring/start-alertmanager.sh:/etc/alertmanager/start-alertmanager.sh:ro
      - alertmanagerdata:/alertmanager
    secrets:
      - alertmanager_webhook_url
    expose:
      - "9093"
    healthcheck:
      test: [ "CMD-SHELL", "wget --spider -q http://localhost:9093/-/healthy || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  prometheus:
    profiles: [ "core" ]
    image: prom/prometheus:v3.0.0
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/monitoring/rules:/etc/prometheus/rules:ro
      - promdata:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy" ]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  grafana:
    profiles: [ "core" ]
    image: grafana/grafana:11.4.0
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?GRAFANA_PASSWORD is required}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafanadata:/var/lib/grafana
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    healthcheck:
      test: [ "CMD-SHELL", "wget --spider -q http://localhost:3000/api/health || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  redis-celerydata:
  miniodata:
  promdata:
  alertmanagerdata:
  grafanadata:

networks:
  # Forwarding headers are trusted only on the two proxy-only API networks.
  # Override both the subnet and SOYMUTDB_FORWARDED_ALLOW_IPS together if the
  # defaults overlap an existing host/VPN route.
  api-proxy:
    ipam:
      config:
        - subnet: ${SOYMUTDB_API_PROXY_SUBNET:-172.30.252.0/28}
  tunnel-api:
    ipam:
      config:
        - subnet: ${SOYMUTDB_TUNNEL_API_SUBNET:-172.30.253.0/28}
  # Data and MCP use separate networks so those services cannot impersonate a
  # trusted API reverse proxy after compromise.
  local-data-proxy:
    ipam:
      config:
        - subnet: ${SOYMUTDB_DATA_PROXY_SUBNET:-172.30.254.0/28}
  local-mcp-proxy:
    ipam:
      config:
        - subnet: ${SOYMUTDB_MCP_PROXY_SUBNET:-172.30.251.0/28}
  tunnel-backend:
    ipam:
      config:
        - subnet: ${SOYMUTDB_TUNNEL_DATA_SUBNET:-172.30.250.0/28}
  # cloudflared has egress but no attachment to application/data networks;
  # tunnel-origin bridges the edge to the two narrow tunnel networks.
  cloudflare-edge:

secrets:
  alertmanager_webhook_url:
    file: ${ALERTMANAGER_WEBHOOK_URL_FILE:-/etc/soymutdb/secrets/alertmanager_webhook_url}
  # The file contains only the remotely-managed Tunnel token. Keep it outside
  # the repository, owned by the deployment account, and mode 0600.
  cloudflare_tunnel_token:
    file: ${CLOUDFLARE_TUNNEL_TOKEN_FILE:-/etc/soymutdb/secrets/cloudflare_tunnel_token}
