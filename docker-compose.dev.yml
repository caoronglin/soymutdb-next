# =====================================================================
# SoyMutDB - Docker Compose (Development)
# =====================================================================
# Adds hot-reload, source mounts, and debug ports for local development.
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
# =====================================================================
services:
  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
      target: runtime
    environment:
      SOYMUTDB_APP_ENV: dev
      SOYMUTDB_DEBUG: "true"
      SOYMUTDB_DATABASE_URL: postgresql+asyncpg://soymutdb:soymutdb_dev_password@postgres:5432/soymutdb
      SOYMUTDB_CLICKHOUSE_HOST: clickhouse
      SOYMUTDB_REDIS_URL: redis://:soymutdb_dev_password@redis:6379/0
      SOYMUTDB_CELERY_BROKER_URL: redis://:soymutdb_dev_password@redis:6379/1
      SOYMUTDB_CELERY_RESULT_BACKEND: redis://:soymutdb_dev_password@redis:6379/2
      SOYMUTDB_S3_ENDPOINT: http://minio:9000
      SOYMUTDB_S3_ACCESS_KEY: minioadmin
      SOYMUTDB_S3_SECRET_KEY: minioadmin
      SOYMUTDB_S3_GWAS_BUCKET: gwas
      SOYMUTDB_S3_ANALYSES_BUCKET: analyses
      SOYMUTDB_JWT_SECRET: dev_jwt_secret_change_in_production
    volumes:
      - ./apps/api/app:/app/apps/api/app:ro
      - ./apps/api/migrations:/app/apps/api/migrations:ro
      - ./apps/api/alembic.ini:/app/apps/api/alembic.ini:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/live"]
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload
      --reload-dir /app/apps/api/app

  worker:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.worker
      target: runtime
    environment:
      SOYMUTDB_APP_ENV: dev
      SOYMUTDB_CELERY_BROKER_URL: redis://:soymutdb_dev_password@redis:6379/1
      SOYMUTDB_CELERY_RESULT_BACKEND: redis://:soymutdb_dev_password@redis:6379/2
      SOYMUTDB_DATABASE_URL: postgresql+psycopg2://soymutdb:soymutdb_dev_password@postgres:5432/soymutdb
      SOYMUTDB_CLICKHOUSE_URL: http://soymutdb:soymutdb_dev_password@clickhouse:8123/soymutdb
      SOYMUTDB_API_APP_PATH: /app/apps/api/app
    volumes:
      - ./apps/worker/src:/app/apps/worker/src:ro
      - ./apps/api/app:/app/apps/api/app:ro
    command: >
      celery -A soymutdb_worker.main:celery_app worker
      --loglevel=debug
      --queues=ingest,export,stats,cleanup,blast,analyses,default
      --concurrency=2
      --pool=solo

  worker-analyses:
    environment:
      SOYMUTDB_APP_ENV: dev
      SOYMUTDB_CELERY_BROKER_URL: redis://:soymutdb_dev_password@redis:6379/1
      SOYMUTDB_CELERY_RESULT_BACKEND: redis://:soymutdb_dev_password@redis:6379/2
      SOYMUTDB_DATABASE_URL: postgresql+psycopg2://soymutdb:soymutdb_dev_password@postgres:5432/soymutdb
      SOYMUTDB_CLICKHOUSE_URL: http://soymutdb:soymutdb_dev_password@clickhouse:8123/soymutdb
      SOYMUTDB_S3_ENDPOINT: http://minio:9000
      SOYMUTDB_S3_ACCESS_KEY: minioadmin
      SOYMUTDB_S3_SECRET_KEY: minioadmin
      SOYMUTDB_S3_GWAS_BUCKET: gwas
      SOYMUTDB_S3_ANALYSES_BUCKET: analyses
    volumes:
      - ./apps/worker/src:/app/apps/worker/src:ro
      - ./apps/api/app:/app/apps/api/app:ro
    command: >
      celery -A soymutdb_worker.main:celery_app worker
      --loglevel=debug --queues=analyses --concurrency=2 --pool=solo

  beat:
    environment:
      SOYMUTDB_APP_ENV: dev
      SOYMUTDB_CELERY_BROKER_URL: redis://:soymutdb_dev_password@redis:6379/1
      SOYMUTDB_CELERY_RESULT_BACKEND: redis://:soymutdb_dev_password@redis:6379/2
    volumes:
      - ./apps/worker/src:/app/apps/worker/src:ro
      - ./apps/api/app:/app/apps/api/app:ro

  web:
    build:
      target: runtime
    volumes:
      - ./apps/web/src:/app/apps/web/src
      - ./apps/web/index.html:/app/apps/web/index.html
      - ./apps/web/vite.config.ts:/app/apps/web/vite.config.ts
      - ./packages:/app/packages
    command: >
      pnpm --filter @soymutdb/web dev --host 0.0.0.0 --port 5173
    ports:
      - "5173:5173"

  admin:
    build:
      target: runtime
    volumes:
      - ./apps/admin/src:/app/apps/admin/src
      - ./apps/admin/index.html:/app/apps/admin/index.html
      - ./apps/admin/vite.config.ts:/app/apps/admin/vite.config.ts
      - ./packages:/app/packages
    command: >
      pnpm --filter @soymutdb/admin dev --host 0.0.0.0 --port 5174
    ports:
      - "5174:5174"

  nginx:
    ports:
      - "8080:80"
